<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Visita – Sala 5</title>
    <meta name="description" content="Museo Pagliaccetti – Villa Ventilj Mosciano Sant'Angelo">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Componenti opzionali già usati altrove -->
    <script src="js/components/aframe-tooltip-component.js"></script>
    <script src="js/components/camera-position.js"></script>
    <script src="js/components/link-controls.js"></script>

    <style>
      /* Toggle audio come nelle altre sale */
      #audioToggle{
        position:absolute; top:10px; right:10px; background:#fff; border-radius:50%;
        padding:10px; cursor:pointer; user-select:none; box-shadow:0 2px 8px rgba(0,0,0,.2);
        font-size:18px; line-height:1; z-index: 10;
      }

      /* Overlay HTML per Sketchfab (fuori dalla scena A-Frame) */
      #sketchfabOverlay{
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,.95); z-index: 20; padding: 24px;
      }
      #sketchfabCard{
        width: min(900px, 92vw);
        max-height: 92vh;
        display: flex; flex-direction: column; gap: 8px;
      }
      #sketchfabFrameWrap{
        position: relative; width: 100%; padding-top: 56.25%; /* 16:9 */
        background: #000;
      }
      #sketchfabFrameWrap iframe{
        position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      }
      #sketchfabCaption{
        color:#fff; font: 500 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align:center; opacity:.9;
      }
      #closeSketchfab{
        align-self:center;
        display:inline-flex; align-items:center; justify-content:center;
        width:38px; height:38px; border-radius:50%; background:#fff; cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.35); user-select:none;
      }
    </style>
  </head>
  <body>
    <a-scene
      raycaster="far: 100; objects: .clickable, [link];"
      cursor="rayOrigin: mouse"
      camera-position
      environment>

      <!-- ASSET -->
      <a-assets>
        <!-- Panorama e preview  -->
        <img id="museopreview" crossorigin="anonymous" src="foto/museopreview.jpg">
        <img id="salacinque360" crossorigin="anonymous" src="foto/salacinque360.jpeg">
        <img id="logo"         crossorigin="anonymous" src="logo/villa_ventilj_logo.png">

        <!-- Icone -->
        <img id="searchIcon" src="icons/search.png">
        <img id="icon3d"     src="icons/icona3d.png">
        <img id="closeIcon"  src="icons/close.png">

        <!-- Immagini singole -->
        <img id="vittorio" src="foto/vittorio.jpg">
        <img id="capponi"  src="foto/capponi.jpg">
        <img id="donna"    src="foto/donna.jpg">

        <!-- Audio (stessa musica delle altre sale) -->
        <audio id="bgSala5" src="audio/sottofondosala2.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Panorama -->
      <a-sky src="#salacinque360" rotation="0 0 0"></a-sky>

      <!-- Musica di sottofondo -->
      <a-entity id="backgroundSound"
                sound="src: #bgSala5; autoplay: true; loop: true; volume: 0.8"></a-entity>

      <!-- Link indietro a Sala 4 -->
      <a-link href="salaquattro.html"
              title="Torna indietro – Sala 4"
              image="#museopreview"
              position="6 0 -2"
              rotation="0 -60 0"></a-link>
      <!-- Link indietro a Sala 6 -->
      <a-link href="salasei.html"
              title="Visita – Sala 6"
              image="#museopreview"
              position="-9 1 -1"
              rotation="0 60 0"></a-link>

      <!-- Copertura treppiede -->
      <a-entity position="10 -130 12" rotation="0 0 0">
        <a-cylinder radius="50" height="0.5"
                    material="color: #ffffff; shader: flat; emissive: #ffffff"></a-cylinder>
        <a-image src="#logo" position="0 1 0" width="70" height="70"
                 rotation="90 205 0" scale="-1 1 1"></a-image>
      </a-entity>

      <!-- ICONE: 3 immagini + 1 Sketchfab -->
      <a-image id="openVittorio" class="clickable" src="#searchIcon"
               position="6 0 6" rotation="0 70 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <a-image id="openCapponi" class="clickable" src="#searchIcon"
               position="-7 1 4" rotation="0 50 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <a-image id="openDonna" class="clickable" src="#searchIcon"
               position="5 0 3" rotation="0 20 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <a-image id="openSketchfab" class="clickable" src="#icon3d"
               position="-2 0.5 7" rotation="0 -10 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <!-- CAMERA + OVERLAY (in-scene) -->
      <a-entity id="rig">
        <a-entity id="cam" camera look-controls position="0 1.6 0">

          <!-- Overlay: Vittorio -->
          <a-entity id="ovVittorio" visible="false" position="0 0 -2">
            <a-plane id="bgVittorio" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="imgVittorio" src="#vittorio" position="0 0.06 0.02"></a-image>

            <a-text value="Testa di V. Emanuele II, terracotta, cm.80x47x50, 1886 ca."
                    align="center" color="#fff" width="1.6"
                    position="0 -0.70 0.02"></a-text>

            <a-image id="closeVittorio" class="clickable" src="#closeIcon"
                     position="0 0.7 0.50" scale="0.24 0.24 0.24"
                     material="shader: flat; transparent: true; alphaTest:0.05; depthTest:false"></a-image>
          </a-entity>

          <!-- Overlay: Capponi -->
          <a-entity id="ovCapponi" visible="false" position="0 0 -2">
            <a-plane id="bgCapponi" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="imgCapponi" src="#capponi" position="0 0.06 0.02"></a-image>

            <a-text value="Ritratto di Gino Capponi,gesso,cm.86x35x20,1877-1878.\n(fusione postuma in bronzo, 2009)"
                    align="center" color="#fff" width="1.6"
                    position="0 -0.70 0.02"></a-text>

            <a-image id="closeCapponi" class="clickable" src="#closeIcon"
                     position="0 -0.85 0.50" scale="0.24 0.24 0.24"
                     material="shader: flat; transparent: true; alphaTest:0.05; depthTest:false"></a-image>
          </a-entity>

          <!-- Overlay: Donna -->
          <a-entity id="ovDonna" visible="false" position="0 0 -2">
            <a-plane id="bgDonna" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="imgDonna" src="#donna" position="0 0.06 0.02"></a-image>

            <a-text value="Busto di donna, gesso."
                    align="center" color="#fff" width="1.6"
                    position="0 -0.70 0.02"></a-text>

            <a-image id="closeDonna" class="clickable" src="#closeIcon"
                     position="0 -0.90 0.50" scale="0.24 0.24 0.24"
                     material="shader: flat; transparent: true; alphaTest:0.05; depthTest:false"></a-image>
          </a-entity>

        </a-entity>
      </a-entity>
    </a-scene>

    <!-- Toggle audio -->
    <div id="audioToggle">🔊</div>

    <!-- Overlay HTML per Sketchfab (fuori dalla scena A-Frame) -->
    <div id="sketchfabOverlay" role="dialog" aria-modal="true" aria-label="Modello 3D – Sketchfab">
      <div id="sketchfabCard">
        <div id="sketchfabFrameWrap">
          <!-- Embed Sketchfab -->
          <iframe
            title="Gioacchino Rossini,gesso,cm.80x65x45,1868-1869 ca. (fusione postuma in bronzo, 2009)"
            allowfullscreen
            mozallowfullscreen="true"
            webkitallowfullscreen="true"
            allow="autoplay; fullscreen; xr-spatial-tracking"
            xr-spatial-tracking
            execution-while-out-of-viewport
            execution-while-not-rendered
            web-share
            src="https://sketchfab.com/models/4119c03f4a034366aad0fbc2d5f96457/embed">
          </iframe>
        </div>
        <div id="sketchfabCaption">
          Gioacchino Rossini,gesso,cm.80x65x45,1868-1869 ca. (fusione postuma in bronzo, 2009)
          — modello 3D incorporato da Sketchfab.
        </div>
        <div id="closeSketchfab" title="Chiudi">✕</div>
      </div>
    </div>

    <script>
      const cam = document.getElementById('cam');

      /* ===== Toggle audio BG ===== */
      (function(){
        const audioToggle = document.getElementById('audioToggle');
        const backgroundSound = document.getElementById('backgroundSound');
        const bgSound = () => backgroundSound?.components?.sound;
        let isSoundOn = true;

        audioToggle.addEventListener('click', () => {
          if (!bgSound()) return;
          isSoundOn = !isSoundOn;
          if (isSoundOn) { bgSound().playSound(); audioToggle.textContent = '🔊'; }
          else           { bgSound().pauseSound(); audioToggle.textContent = '🔇'; }
        });
      })();

      /* ===== Helper: fit immagine ===== */
      function fitToBox(assetSelector, imgEntityId, maxW=2.0, maxH=1.3){
        const asset=document.querySelector(assetSelector);
        const img=document.getElementById(imgEntityId);
        if(!asset) return;
        const ready=()=>{
          const w=asset.naturalWidth, h=asset.naturalHeight; if(!w||!h) return;
          const ar=w/h, boxAr=maxW/maxH;
          let W,H; if(ar>boxAr){ W=maxW; H=maxW/ar; } else { H=maxH; W=maxH*ar; }
          img.setAttribute('width',W.toFixed(3));
          img.setAttribute('height',H.toFixed(3));
        };
        if(asset.complete) ready(); else asset.addEventListener('load', ready, {once:true});
      }

      /* ===== Registry overlay foto ===== */
      const OV = {
        vittorio: {open:'openVittorio', ov:'ovVittorio', bg:'bgVittorio', close:'closeVittorio', img:'imgVittorio'},
        capponi:  {open:'openCapponi',  ov:'ovCapponi',  bg:'bgCapponi',  close:'closeCapponi',  img:'imgCapponi'},
        donna:    {open:'openDonna',    ov:'ovDonna',    bg:'bgDonna',    close:'closeDonna',    img:'imgDonna'}
      };

      let openCount = 0;
      const pauseCam = ()=> cam.components['look-controls']?.pause();
      const playCamIfNone = ()=> { if (openCount<=0) cam.components['look-controls']?.play(); };

      function closeAllOverlays(skipFade=false){
        Object.keys(OV).forEach(k=>{
          const ovEl = document.getElementById(OV[k].ov);
          const bgEl = document.getElementById(OV[k].bg);
          if (ovEl.getAttribute('visible')){
            if (skipFade){
              ovEl.setAttribute('visible', false);
            } else {
              bgEl.setAttribute('animation__fadeout','property: material.opacity; from:0.95; to:0; dur:220; easing:easeInQuad');
              setTimeout(()=> ovEl.setAttribute('visible', false), 220);
            }
          }
        });
        openCount = 0;
      }

      function openOverlay(key){
        const {ov,bg,img} = OV[key];
        const ovEl = document.getElementById(ov);
        const bgEl = document.getElementById(bg);
        const imgEl= document.getElementById(img);

        // chiudi tutto prima di aprire questo
        closeAllOverlays(true);

        ovEl.setAttribute('visible', true);
        openCount++;
        pauseCam();
        bgEl.setAttribute('animation__fadein','property: material.opacity; from:0; to:0.95; dur:250; easing:easeOutQuad');

        const srcSel = imgEl.getAttribute('src');
        fitToBox(srcSel, img);
      }

      function closeOverlay(key){
        const {ov,bg} = OV[key];
        const ovEl = document.getElementById(ov);
        const bgEl = document.getElementById(bg);
        if (!ovEl.getAttribute('visible')) return;
        bgEl.setAttribute('animation__fadeout','property: material.opacity; from:0.95; to:0; dur:220; easing:easeInQuad');
        setTimeout(()=>{
          ovEl.setAttribute('visible', false);
          openCount = Math.max(0, openCount-1);
          playCamIfNone();
        }, 220);
      }

      function wire(key){
        document.getElementById(OV[key].open ).addEventListener('click', e=>{ e.stopPropagation(); openOverlay(key);  });
        document.getElementById(OV[key].close).addEventListener('click', e=>{ e.stopPropagation(); closeOverlay(key); });
      }
      wire('vittorio'); wire('capponi'); wire('donna');

      /* ===== Overlay Sketchfab (HTML sopra la scena) ===== */
      (function(){
        const openBtn = document.getElementById('openSketchfab');
        const overlay = document.getElementById('sketchfabOverlay');
        const closeBtn= document.getElementById('closeSketchfab');

        openBtn.addEventListener('click', (e)=>{
          e.stopPropagation();
          closeAllOverlays(true);
          overlay.style.display = 'flex';
          openCount++;
          pauseCam();
        });

        function close(){
          overlay.style.display = 'none';
          openCount = Math.max(0, openCount-1);
          playCamIfNone();
        }

        closeBtn.addEventListener('click', (e)=>{ e.stopPropagation(); close(); });
        overlay.addEventListener('click', (e)=>{ if (e.target === overlay) close(); });
      })();
    </script>
  </body>
</html>
