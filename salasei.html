<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Visita – Sala 6</title>
    <meta name="description" content="Museo Pagliaccetti – Villa Ventilj Mosciano Sant'Angelo">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Componenti opzionali -->
    <script src="js/components/aframe-tooltip-component.js"></script>
    <script src="js/components/camera-position.js"></script>
    <script src="js/components/link-controls.js"></script>

    <style>
      #audioToggle{
        position:absolute; top:10px; right:10px; background:#fff; border-radius:50%;
        padding:10px; cursor:pointer; user-select:none; box-shadow:0 2px 8px rgba(0,0,0,.2);
        font-size:18px; line-height:1; z-index: 10;
      }
      #sketchfabOverlay{
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,.95); z-index: 20; padding: 24px;
      }
      #sketchfabCard{
        width: min(1000px, 92vw);
        max-height: 92vh;
        display: flex; flex-direction: column; gap: 8px;
      }
      #sketchfabFrameWrap{
        position: relative; width: 100%; padding-top: 56.25%;
        background: #000;
      }
      #sketchfabFrameWrap iframe{
        position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      }
      #sketchfabCaption{
        color:#fff; font: 500 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align:center; opacity:.9;
      }
      #closeSketchfab{
        align-self:center;
        display:inline-flex; align-items:center; justify-content:center;
        width:38px; height:38px; border-radius:50%; background:#fff; cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.35); user-select:none;
      }
    </style>
  </head>
  <body>
    <a-scene
      cursor="rayOrigin: mouse"
      raycaster="far: 100; objects: .clickable, [link];"
      camera-position
      environment>

      <!-- ASSETS -->
      <a-assets>
        <!-- Panorami e preview -->
        <img id="museopreview"      crossorigin="anonymous" src="foto/museopreview.jpg">
        <img id="salasei360_1"      crossorigin="anonymous" src="foto/salasei360_1.jpeg">
        <img id="salasei360_2"      crossorigin="anonymous" src="foto/salasei360_2.jpeg">
        <img id="salasei360_3"      crossorigin="anonymous" src="foto/salasei360_3.jpeg">
        <img id="uscitapreview"     crossorigin="anonymous" src="foto/uscitapreview.jpg">
        <img id="logo"              crossorigin="anonymous" src="logo/villa_ventilj_logo.png">

        <!-- Patch per lacuna della volta -->
        <img id="voltaPatch"        src="foto/volta_patch.png">

        <!-- Icone -->
        <img id="cambio360"  src="icons/cambio360.png">
        <img id="searchIcon" src="icons/search.png">
        <img id="icon3d"     src="icons/icona3d.png">
        <img id="closeIcon"  src="icons/close.png">
        <img id="arrowL"     src="icons/arrowleft.png">
        <img id="arrowR"     src="icons/arrowright.png">

        <!-- Gallerie -->
        <img id="garibaldi1" src="foto/garibaldi1.jpg">
        <img id="garibaldi2" src="foto/garibaldi2.jpg">
        <img id="garibaldi3" src="foto/garibaldi3.jpg">

        <img id="emma1" src="foto/emma1.jpg">
        <img id="emma2" src="foto/emma2.jpg">
        <img id="emma3" src="foto/emma3.jpg">

        <img id="bozzetto1" src="foto/bozzetto1.jpg">
        <img id="bozzetto2" src="foto/bozzetto2.jpg">
        <img id="bozzetto3" src="foto/bozzetto3.jpg">

        <!-- Audio -->
        <audio id="bgSala6" src="audio/sottofondosala2.mp3" preload="auto"></audio>
      </a-assets>

      <!-- PANORAMA + Musica -->
      <a-sky id="sky" src="#salasei360_1" rotation="0 0 0" material="shader: flat"></a-sky>
      <a-entity id="backgroundSound"
                sound="src: #bgSala6; autoplay: true; loop: true; volume: 0.8"></a-entity>

      <!-- Freccia cambio vista -->
      <a-image id="nextView"
               class="clickable"
               src="#cambio360"
               position="-5 3 5"
               scale="0.6 0.6 0.6"
               rotation="0 150 0"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <!-- Link stanze -->
      <a-link href="salacinque.html"
              title="Torna indietro – Sala 5"
              image="#museopreview"
              position="-3 0 -8"
              rotation="0 0 0"></a-link>

      <a-link href="uscitamuseo.html"
              title="Uscita – Piano nobile"
              image="#uscitapreview"
              position="8 0 -1"
              rotation="0 -90 0"></a-link>

      <!-- Copertura treppiede + logo -->
      <a-entity position="10 -180 12">
        <a-cylinder radius="50" height="0.5"
                    material="color:#ffffff; shader: flat; emissive:#ffffff"></a-cylinder>
        <a-image src="#logo" position="0 1 0" width="70" height="70"
                 rotation="90 205 0" scale="-1 1 1"></a-image>
      </a-entity>

      <!-- Patch lacuna volta -->
      <a-plane id="patchVolta" 
               src="#voltaPatch" 
               position="-2 7 -2" 
               rotation="-100 0 130" 
               width="10" 
               height="6" 
               material="transparent:true; opacity:0.95; side:double"
               look-at="#cam">
      </a-plane>

      <!-- ICONE GALLERIE E 3D -->
      <a-entity id="iconsGroup">
        <a-image id="openGaribaldi" class="clickable" src="#searchIcon"
                 position="1 0 10" rotation="0 60 0" scale="0.7 0.7 0.7"
                 material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>
        <a-image id="openEmma" class="clickable" src="#searchIcon"
                 position="-4 2 9" rotation="0 -10 0" scale="0.7 0.7 0.7"
                 material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>
        <a-image id="openBozzetto" class="clickable" src="#searchIcon"
                 position="5 0 6" rotation="0 20 0" scale="0.7 0.7 0.7"
                 material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>
        <a-image id="openSketchfab" class="clickable" src="#icon3d"
                 position="-2 0.5 4" rotation="0 -30 0" scale="0.7 0.7 0.7"
                 material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>
      </a-entity>

      <!-- CAMERA + OVERLAY -->
      <a-entity id="rig">
        <a-entity id="cam" camera look-controls position="0 1.6 0">
          <!-- Overlay gallerie -->
          ...
        </a-entity>
      </a-entity>
    </a-scene>

    <!-- Toggle audio -->
    <div id="audioToggle">🔊</div>

    <!-- Overlay Sketchfab -->
    <div id="sketchfabOverlay">
      <div id="sketchfabCard">
        <div id="sketchfabFrameWrap">
          <iframe
            title="Modello 3D scultura"
            allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true"
            allow="autoplay; fullscreen; xr-spatial-tracking"
            xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share
            src="https://sketchfab.com/models/519c2c38a8044c52a4883365767491d7/embed">
          </iframe>
        </div>
        <div id="sketchfabCaption">
          Bozzetto per il monumento a Ugo Foscolo, fusione postuma in bronzo, 2009. Modello 3D integrato tramite Sketchfab.
        </div>
        <div id="closeSketchfab" title="Chiudi">✕</div>
      </div>
    </div>

    <script>
      const cam = document.getElementById('cam');

      // SWITCH PANORAMI + ICONE
      (function(){
        const sky = document.getElementById('sky');
        const nextView = document.getElementById('nextView');
        const iconsGroup = document.getElementById('iconsGroup');
        const views = ['#salasei360_1', '#salasei360_2', '#salasei360_3'];
        let idx = 0;
        function applyView(){
          sky.setAttribute('src', views[idx]);
          // le icone rimangono sempre visibili
          iconsGroup.setAttribute('visible', true);
        }
        applyView();
        nextView.addEventListener('click', () => { idx = (idx + 1) % views.length; applyView(); });
      })();

      // TOGGLE AUDIO
      (function(){
        const audioToggle = document.getElementById('audioToggle');
        const backgroundSound = document.getElementById('backgroundSound');
        const bgSound = () => backgroundSound?.components?.sound;
        let isSoundOn = true;
        audioToggle.addEventListener('click', () => {
          if (!bgSound()) return;
          isSoundOn = !isSoundOn;
          if (isSoundOn) { bgSound().playSound(); audioToggle.textContent = '🔊'; }
          else           { bgSound().pauseSound(); audioToggle.textContent = '🔇'; }
        });
      })();

      // CLICK GALLERIE / SKETCHFAB
      const openGaribaldi = document.getElementById('openGaribaldi');
      const openEmma     = document.getElementById('openEmma');
      const openBozzetto = document.getElementById('openBozzetto');
      const openSketchfab= document.getElementById('openSketchfab');
      const overlay      = document.getElementById('sketchfabOverlay');
      const closeOverlay = document.getElementById('closeSketchfab');

      openSketchfab.addEventListener('click', ()=>{ overlay.style.display='flex'; });
      closeOverlay.addEventListener('click', ()=>{ overlay.style.display='none'; });

      // Altri script per gallerie qui...
    </script>
  </body>
</html>
