<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cappella Ventilj</title>
    <meta name="description" content="Cappella privata Villa Ventilj">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      #audioToggle{
        position:absolute; top:10px; right:10px; background:#fff;
        padding:10px; border-radius:50%; cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.3); font-size:18px;
      }
    </style>
  </head>
  <body>
    <a-scene raycaster="far: 100; objects: .clickable, [link];" cursor="rayOrigin: mouse">

      <!-- ASSETS -->
      <a-assets>
        <img id="chiesa1" crossorigin="anonymous" src="foto/chiesa_1.jpeg">
        <img id="chiesa2" crossorigin="anonymous" src="foto/chiesa_2.jpeg">
        <img id="vetratapreview" crossorigin="anonymous" src="foto/vetratapreview.jpg">
        <img id="logo" crossorigin="anonymous" src="logo/villa_ventilj_logo.png">

        <!-- icone e immagine affresco -->
        <img id="cambio360" src="icons/cambio360.png">
        <img id="infoIcon"  src="icons/info.png">
        <img id="closeIcon" src="icons/close.png">
        <img id="affrescoImg" src="foto/affresco_cappella.jpg">

        <audio id="background-music" src="audio/chiesa.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Panorama -->
      <a-sky id="sky" src="#chiesa1" rotation="0 0 0" material="shader: flat"></a-sky>

      <!-- Audio bg -->
      <a-entity id="backgroundSound" sound="src: #background-music; autoplay: true; loop: true; volume: 0.8"></a-entity>

      <!-- Link back -->
      <a-link href="index.html"
              title="Torna all'ingresso"
              image="#vetratapreview"
              position="6 1 -4"
              rotation="0 -40 0"></a-link>

      <!-- Cambio angolazione -->
      <a-image id="nextView"
               class="clickable"
               src="#cambio360"
               position="-4 1.5 3"
               scale="0.7 0.7 0.7"
               rotation="0 120 0"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <!-- ICONA INFO nel punto dell’affresco -->
      <a-image id="infoButton"
               class="clickable"
               src="#infoIcon"
               position="-4 4 3"
               rotation="0 120 0"
               scale="0.35 0.35 0.35"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <!-- Logo pavimento -->
      <a-entity position="10 -180 12">
        <a-cylinder radius="50" height="0.5" color="#ffffff"></a-cylinder>
        <a-image src="#logo" position="0 1 0" width="70" height="70"
                 rotation="90 120 0" scale="-1 1 1"></a-image>
      </a-entity>

      <!-- CAMERA + OVERLAY (HUD) -->
      <a-entity id="rig" position="0 0 0">
        <a-entity id="cam" camera look-controls position="0 1.6 0">
          <!-- OVERLAY attaccato alla camera -->
          <a-entity id="uiOverlay" visible="false" position="0 0 -1">
            <!-- sfondo pannello (dimensioni adattate via JS) -->
            <a-plane id="uiBg"
                     width="2.0" height="1.2"
                     material="color: #ffffff; opacity: 0.0; transparent: true; depthTest: false"></a-plane>

            <!-- pulsante chiudi -->
            <a-image id="uiClose"
                     class="clickable"
                     src="#closeIcon"
                     position="0.86 0.53 0.01"
                     scale="0.12 0.12 0.12"
                     material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

            <!-- immagine affresco -->
            <a-image id="uiImg"
                     src="#affrescoImg"
                     position="-0.55 0 0.01"
                     width="0.9" height="0.9"
                     material="shader: flat; transparent: true"></a-image>

            <!-- colonna testo -->
            <a-entity id="uiTextCol" position="0.25 0.35 0.01">
              <a-text value="AUTORE:" color="#000" width="1.2" align="left"></a-text>
              <a-text value="Francesco Patella (1880-1964)" color="#333" width="1.2" align="left" position="0 -0.16 0"></a-text>

              <a-text value="TIPOLOGIA:" color="#000" width="1.2" align="left" position="0 -0.36 0"></a-text>
              <a-text value="Affresco" color="#333" width="1.2" align="left" position="0 -0.52 0"></a-text>

              <a-text value="DATAZIONE:" color="#000" width="1.2" align="left" position="0 -0.72 0"></a-text>
              <a-text value="1903-1940?" color="#333" width="1.2" align="left" position="0 -0.88 0"></a-text>

              <a-text value="COLLOCAZIONE:" color="#000" width="1.2" align="left" position="0 -1.08 0"></a-text>
              <a-text value="Cappella, Abside – Villa Ventilj" color="#333" width="1.2" align="left" position="0 -1.24 0" wrap-count="28"></a-text>

              <a-text value="DESCRIZIONE:" color="#000" width="1.2" align="left" position="0 -1.48 0"></a-text>
              <a-text value="Pittura raffigurante il Municipio, l’asilo infantile e le orfanelle."
                      color="#333" width="1.2" align="left" position="0 -1.64 0" wrap-count="28"></a-text>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Controller VR -->
      <a-entity id="leftHand" link-controls="hand: left"></a-entity>
      <a-entity id="rightHand" link-controls="hand: right"></a-entity>
    </a-scene>

    <!-- Toggle audio -->
    <div id="audioToggle">🔊</div>

    <script>
      // Cambio scena 1 ↔ 2
      const sky = document.getElementById('sky');
      const nextView = document.getElementById('nextView');
      let currentScene = 1;
      nextView.addEventListener('click', () => {
        if (currentScene === 1) { sky.setAttribute('src', '#chiesa2'); currentScene = 2; }
        else { sky.setAttribute('src', '#chiesa1'); currentScene = 1; }
      });

      // Toggle audio
      const audioToggle = document.getElementById('audioToggle');
      const backgroundSound = document.querySelector('#backgroundSound');
      let isSoundOn = true;
      audioToggle.addEventListener('click', () => {
        isSoundOn = !isSoundOn;
        if (isSoundOn) { backgroundSound.components.sound.playSound(); audioToggle.textContent = '🔊'; }
        else { backgroundSound.components.sound.pauseSound(); audioToggle.textContent = '🔇'; }
      });

      // RIFERIMENTI overlay
      const infoBtn  = document.getElementById('infoButton');
      const ui       = document.getElementById('uiOverlay');
      const uiBg     = document.getElementById('uiBg');
      const uiClose  = document.getElementById('uiClose');
      const uiImg    = document.getElementById('uiImg');
      const uiText   = document.getElementById('uiTextCol');

      // ====== LAYOUT RESPONSIVE (VARIANTE A) ======
      function applyResponsiveLayout() {
        const isPortrait = window.innerHeight >= window.innerWidth;
        const isSmall = Math.min(window.innerWidth, window.innerHeight) < 720;

        if (isPortrait || isSmall) {
          // MOBILE / verticale → immagine sopra, testo sotto (più piccolo)
          uiBg.setAttribute('width', 1.25);
          uiBg.setAttribute('height', 1.95);

          uiClose.setAttribute('position', {x: 0.55, y: 0.92, z: 0.01});

          // FOTO al centro, leggermente a destra
          uiImg.setAttribute('position', {x: 0.10, y: 0.48, z: 0.01});
          uiImg.setAttribute('width', 0.90);
          uiImg.setAttribute('height', 0.90);

          // TESTO sotto, più piccolo e stretto
          uiText.setAttribute('position', {x: -0.55, y: -0.08, z: 0.01});
          Array.from(uiText.children).forEach(n => {
            n.setAttribute('align', 'left');
            n.setAttribute('width', 0.95);
            n.setAttribute('wrap-count', 22);
            n.setAttribute('scale', '0.85 0.85 0.85');
          });

        } else {
          // DESKTOP / visore → immagine a destra, testo a sinistra (più piccolo)
          uiBg.setAttribute('width', 1.9);
          uiBg.setAttribute('height', 1.2);

          uiClose.setAttribute('position', {x: 0.86, y: 0.53, z: 0.01});

          // FOTO spostata a destra
          uiImg.setAttribute('position', {x: 0.40, y: 0.0, z: 0.01});
          uiImg.setAttribute('width', 0.75);
          uiImg.setAttribute('height', 0.75);

          // TESTO a sinistra, vicino al centro e più piccolo
          uiText.setAttribute('position', {x: -0.70, y: 0.35, z: 0.01});
          Array.from(uiText.children).forEach(n => {
            n.setAttribute('align', 'left');
            n.setAttribute('width', 1.05);
            n.setAttribute('wrap-count', 24);
            n.setAttribute('scale', '0.9 0.9 0.9');
          });
        }
      }

      // Fade in/out overlay
      function openOverlay() {
        applyResponsiveLayout();
        ui.setAttribute('visible', true);
        uiBg.setAttribute('animation__fadein',
          'property: material.opacity; from: 0; to: 0.98; dur: 250; easing: easeOutQuad');
      }
      function closeOverlay() {
        uiBg.setAttribute('animation__fadeout',
          'property: material.opacity; from: 0.98; to: 0; dur: 220; easing: easeInQuad');
        setTimeout(() => ui.setAttribute('visible', false), 220);
      }

      infoBtn.addEventListener('click', openOverlay);
      uiClose.addEventListener('click', closeOverlay);
      window.addEventListener('resize', () => { if (ui.getAttribute('visible')) applyResponsiveLayout(); });
      window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.getAttribute('visible')) closeOverlay(); });
    </script>
  </body>
</html>
