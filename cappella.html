<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cappella Ventilj</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      #audioToggle{
        position:absolute; top:10px; right:10px; background:#fff;
        padding:10px; border-radius:50%; cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.3); font-size:18px;
      }
    </style>
  </head>
  <body>
    <a-scene raycaster="far: 100; objects: .clickable, [link];" cursor="rayOrigin: mouse">

      <!-- ASSETS -->
      <a-assets>
        <img id="chiesa1" src="foto/chiesa_1.jpeg">
        <img id="chiesa2" src="foto/chiesa_2.jpeg">
        <img id="vetratapreview" src="foto/vetratapreview.jpg">
        <img id="logo" src="logo/villa_ventilj_logo.png">
        <img id="cambio360" src="icons/cambio360.png">
        <img id="infoIcon" src="icons/info.png">
        <img id="searchIcon" src="icons/search.png">
        <img id="closeIcon" src="icons/close.png">
        <img id="schedaAffresco" src="foto/schedaaffresco.jpg">
        <img id="affresco2" src="foto/affrescocappella2.jpg">
        <audio id="background-music" src="audio/chiesa.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Panorama iniziale -->
      <a-sky id="sky" src="#chiesa1" rotation="0 0 0"></a-sky>

      <!-- Musica di sottofondo -->
      <a-entity id="backgroundSound" sound="src: #background-music; autoplay: true; loop: true; volume: 0.8"></a-entity>

      <!-- Link per tornare indietro -->
      <a-link href="index.html" image="#vetratapreview"
              title="Torna all'ingresso"
              position="6 1 -4" rotation="0 -40 0"></a-link>

      <!-- Pulsante cambio angolazione -->
      <a-image id="nextView" class="clickable" src="#cambio360"
               position="-4 1.5 3" scale="0.7 0.7 0.7" rotation="0 120 0"></a-image>

      <!-- Pulsante INFO (scheda Canva) -->
      <a-image id="infoButton" class="clickable" src="#infoIcon"
               position="-4 4 3" rotation="0 120 0" scale="0.35 0.35 0.35"></a-image>

      <!-- Pulsante FOTO (apre immagine singola) -->
      <a-image id="photoButton" class="clickable" src="#searchIcon"
               position="2 3 -2" rotation="0 -30 0" scale="0.35 0.35 0.35"></a-image>

      <!-- Logo sul pavimento -->
      <a-entity position="10 -180 12">
        <a-cylinder radius="50" height="0.5" color="#ffffff"></a-cylinder>
        <a-image src="#logo" position="0 1 0" width="70" height="70"
                 rotation="90 120 0"></a-image>
      </a-entity>

      <!-- CAMERA + OVERLAY scheda info -->
      <a-entity id="rig">
        <a-entity id="cam" camera look-controls position="0 1.6 0">
          <!-- Overlay scheda Canva -->
          <a-entity id="uiOverlay" visible="false" position="0 0 -1">
            <a-plane id="uiBg" width="2.2" height="1.6"
                     material="color: #ffffff; opacity: 0.0; transparent: true"></a-plane>
            <a-image id="uiImg" src="#schedaAffresco" position="0 0 0.01"></a-image>
            <a-image id="uiClose" class="clickable" src="#closeIcon"
                     position="0 -0.9 0.02" scale="0.18 0.18 0.18"></a-image>
          </a-entity>

          <!-- Overlay foto singola -->
          <a-entity id="uiOverlayPhoto" visible="false" position="0 0 -1">
            <a-plane id="uiBgPhoto" width="2.2" height="1.6"
                     material="color: #000000; opacity: 0.0; transparent: true"></a-plane>
            <a-image id="uiImgPhoto" src="#affresco2" position="0 0 0.01"></a-image>
            <a-image id="uiClosePhoto" class="clickable" src="#closeIcon"
                     position="0 -0.9 0.02" scale="0.18 0.18 0.18"></a-image>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Controller VR -->
      <a-entity id="leftHand" link-controls="hand: left"></a-entity>
      <a-entity id="rightHand" link-controls="hand: right"></a-entity>
    </a-scene>

    <!-- Toggle audio -->
    <div id="audioToggle">🔊</div>

    <script>
      // Cambio scena
      const sky = document.getElementById('sky');
      const nextView = document.getElementById('nextView');
      let currentScene = 1;
      nextView.addEventListener('click', () => {
        if (currentScene === 1) { sky.setAttribute('src', '#chiesa2'); currentScene = 2; }
        else { sky.setAttribute('src', '#chiesa1'); currentScene = 1; }
      });

      // Toggle audio
      const audioToggle = document.getElementById('audioToggle');
      const backgroundSound = document.querySelector('#backgroundSound');
      let isSoundOn = true;
      audioToggle.addEventListener('click', () => {
        isSoundOn = !isSoundOn;
        if (isSoundOn) { backgroundSound.components.sound.playSound(); audioToggle.textContent = '🔊'; }
        else { backgroundSound.components.sound.pauseSound(); audioToggle.textContent = '🔇'; }
      });

      // Overlay scheda Canva
      const infoBtn  = document.getElementById('infoButton');
      const ui       = document.getElementById('uiOverlay');
      const uiBg     = document.getElementById('uiBg');
      const uiClose  = document.getElementById('uiClose');

      function openOverlay() {
        ui.setAttribute('visible', true);
        uiBg.setAttribute('animation__fadein',
          'property: material.opacity; from: 0; to: 0.98; dur: 250');
      }
      function closeOverlay() {
        uiBg.setAttribute('animation__fadeout',
          'property: material.opacity; from: 0.98; to: 0; dur: 220');
        setTimeout(() => ui.setAttribute('visible', false), 220);
      }

      infoBtn.addEventListener('click', openOverlay);
      uiClose.addEventListener('click', closeOverlay);

      // Overlay foto singola
      const photoBtn   = document.getElementById('photoButton');
      const uiPhoto    = document.getElementById('uiOverlayPhoto');
      const uiBgPhoto  = document.getElementById('uiBgPhoto');
      const uiClosePhoto = document.getElementById('uiClosePhoto');

      function openPhoto() {
        uiPhoto.setAttribute('visible', true);
        uiBgPhoto.setAttribute('animation__fadein',
          'property: material.opacity; from: 0; to: 0.95; dur: 250');
      }
      function closePhoto() {
        uiBgPhoto.setAttribute('animation__fadeout',
          'property: material.opacity; from: 0.95; to: 0; dur: 220');
        setTimeout(() => uiPhoto.setAttribute('visible', false), 220);
      }

      photoBtn.addEventListener('click', openPhoto);
      uiClosePhoto.addEventListener('click', closePhoto);

      // Ridimensiona immagine scheda
      (function fitOverlayImage() {
        const asset = document.querySelector('#schedaAffresco');
        const uiImg = document.getElementById('uiImg');
        const maxW = 2.0, maxH = 1.3;
        const onReady = () => {
          const w = asset.naturalWidth, h = asset.naturalHeight;
          if (!w || !h) return;
          const ar = w / h, boxAr = maxW / maxH;
          let targetW, targetH;
          if (ar > boxAr) { targetW = maxW; targetH = maxW / ar; }
          else { targetH = maxH; targetW = maxH * ar; }
          uiImg.setAttribute('width', targetW.toFixed(3));
          uiImg.setAttribute('height', targetH.toFixed(3));
        };
        if (asset.complete) onReady(); else asset.addEventListener('load', onReady);
      })();

      // Ridimensiona immagine foto singola
      (function fitPhotoImage() {
        const asset = document.querySelector('#affresco2');
        const uiImg = document.getElementById('uiImgPhoto');
        const maxW = 2.0, maxH = 1.3;
        const onReady = () => {
          const w = asset.naturalWidth, h = asset.naturalHeight;
          if (!w || !h) return;
          const ar = w / h, boxAr = maxW / maxH;
          let targetW, targetH;
          if (ar > boxAr) { targetW = maxW; targetH = maxW / ar; }
          else { targetH = maxH; targetW = maxH * ar; }
          uiImg.setAttribute('width', targetW.toFixed(3));
          uiImg.setAttribute('height', targetH.toFixed(3));
        };
        if (asset.complete) onReady(); else asset.addEventListener('load', onReady);
      })();
    </script>
  </body>
</html>
