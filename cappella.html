<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cappella Ventilj</title>
    <meta name="description" content="Cappella privata Villa Ventilj">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
      #audioToggle {
        position:absolute; top:10px; right:10px; background:#fff;
        padding:10px; border-radius:50%; cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.3);
        font-size:18px;
      }
    </style>
  </head>
  <body>
    <a-scene raycaster="far: 100; objects: .clickable, [link];" cursor="rayOrigin: mouse">

      <!-- ASSETS -->
      <a-assets>
        <img id="chiesa1" crossorigin="anonymous" src="foto/chiesa_1.jpeg">
        <img id="chiesa2" crossorigin="anonymous" src="foto/chiesa_2.jpeg">
        <img id="vetratapreview" crossorigin="anonymous" src="foto/vetratapreview.jpg">
        <img id="logo" crossorigin="anonymous" src="logo/villa_ventilj_logo.png">

        <!-- icone e immagine affresco -->
        <img id="cambio360" src="icons/cambio360.png">
        <img id="infoIcon"  src="icons/info.png">
        <img id="closeIcon" src="icons/close.png">
        <img id="affrescoImg" src="foto/affresco_cappella.jpg">

        <audio id="background-music" src="audio/chiesa.mp3" preload="auto"></audio>
      </a-assets>
      
      <!-- Panorama iniziale -->
      <a-sky id="sky" src="#chiesa1" rotation="0 0 0" material="shader: flat"></a-sky>
      
      <!-- Musica di sottofondo -->
      <a-entity id="backgroundSound" sound="src: #background-music; autoplay: true; loop: true; volume: 0.8"></a-entity>

      <!-- Link per tornare all'ingresso -->
      <a-link href="index.html"
              title="Torna all'ingresso"
              image="#vetratapreview"
              position="6 1 -4"
              rotation="0 -40 0"></a-link>
      
      <!-- Icona per cambiare angolazione -->
      <a-image id="nextView"
               class="clickable"
               src="#cambio360"
               position="-4 1.5 3"
               scale="0.7 0.7 0.7"
               rotation="0 120 0"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <!-- GRUPPO: icona info + pannello ancorati insieme -->
      <a-entity id="infoGroup"
                position="-4 4 3"
                rotation="0 120 0">
             
        <!-- icona info -->
        <a-image id="infoButton"
                 class="clickable"
                 src="#infoIcon"
                 position="0 0 0"
                 scale="0.35 0.35 0.35"
                 material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

        <!-- pannello posizionato DAVANTI all’icona -->
        <a-entity id="infoPanel" visible="false">
          <!-- sfondo pannello: leggermente avanti all’icona -->
          <a-plane id="infoBg"
                   position="0 0 -1.2"
                   width="3.5" height="2.2"
                   material="color: #ffffff; opacity: 0.0"></a-plane>

          <!-- immagine affresco a sinistra -->
          <a-image src="#affrescoImg"
                   position="-1.1 0 -1.19"
                   width="1.4" height="1.4"
                   material="shader: flat"></a-image>

          <!-- testo a destra -->
          <a-entity position="0.6 0 -1.19">
            <a-text value="Autore: Francesco Patella (1880-1964)\nTipologia: Affresco\nDatazione: 1903-1940?\nCollocazione: Cappella, Abside – Villa Ventilj\nDescrizione: Pittura raffigurante il Municipio, l’asilo infantile e le orfanelle."
                    color="#111"
                    wrap-count="30"
                    align="left"
                    width="1.9"></a-text>
          </a-entity>

          <!-- pulsante chiudi (X) in alto a destra del pannello -->
          <a-image id="closeInfo"
                   class="clickable"
                   src="#closeIcon"
                   position="1.55 1.0 -1.18"
                   scale="0.2 0.2 0.2"
                   material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>
        </a-entity>
      </a-entity>

      <!-- Copertura treppiedi + logo -->
      <a-entity position="10 -180 12">
        <a-cylinder radius="50" height="0.5" color="#ffffff"></a-cylinder>
        <a-image src="#logo" position="0 1 0" width="70" height="70"
                 rotation="90 120 0" scale="-1 1 1"></a-image>
      </a-entity>

      <!-- Controller VR -->
      <a-entity id="leftHand" link-controls="hand: left"></a-entity>
      <a-entity id="rightHand" link-controls="hand: right"></a-entity>
    </a-scene>

    <!-- Pulsante HTML per il toggle audio -->
    <div id="audioToggle">🔊</div>

    <script>
      // Cambio scena 1 ↔ 2
      const sky = document.getElementById('sky');
      const nextView = document.getElementById('nextView');
      let currentScene = 1;
      nextView.addEventListener('click', () => {
        if (currentScene === 1) { sky.setAttribute('src', '#chiesa2'); currentScene = 2; }
        else { sky.setAttribute('src', '#chiesa1'); currentScene = 1; }
      });

      // Toggle audio
      const audioToggle = document.getElementById('audioToggle');
      const backgroundSound = document.querySelector('#backgroundSound');
      let isSoundOn = true;
      audioToggle.addEventListener('click', () => {
        isSoundOn = !isSoundOn;
        if (isSoundOn) { backgroundSound.components.sound.playSound(); audioToggle.textContent = '🔊'; }
        else { backgroundSound.components.sound.pauseSound(); audioToggle.textContent = '🔇'; }
      });

      // Pannello info: apri/chiudi con dissolvenza
      const infoBtn   = document.getElementById('infoButton');
      const infoPanel = document.getElementById('infoPanel');
      const infoBg    = document.getElementById('infoBg');
      const closeBtn  = document.getElementById('closeInfo');

      infoBtn.addEventListener('click', () => {
        infoPanel.setAttribute('visible', true);
        infoBg.setAttribute('animation__fadein',
          'property: material.opacity; from: 0; to: 0.95; dur: 350; easing: easeInOutQuad');
      });

      closeBtn.addEventListener('click', () => {
        infoBg.setAttribute('animation__fadeout',
          'property: material.opacity; from: 0.95; to: 0; dur: 300; easing: easeInOutQuad');
        setTimeout(() => infoPanel.setAttribute('visible', false), 300);
      });
    </script>
  </body>
</html>
