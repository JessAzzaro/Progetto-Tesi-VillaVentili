<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visita - Sala 1</title>
  <meta name="description" content="Museo Pagliaccetti - Villa Ventilj Mosciano Sant'Angelo">

  <!-- A-Frame core -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Componenti -->
  <script src="js/components/aframe-tooltip-component.js"></script>
  <script src="js/components/camera-position.js"></script>
  <script src="js/components/link-controls.js"></script>
</head>
<body>
  <a-scene
    raycaster="far: 100; objects: .clickable, [link];"
    cursor="rayOrigin: mouse"
    camera-position
    environment>

    <!-- Assets -->
    <a-assets>
      <img id="museopreview" crossorigin="anonymous" src="foto/museopreview.jpg">
      <img id="salazena360" crossorigin="anonymous" src="foto/salazena360.jpeg">
      <img id="logo" crossorigin="anonymous" src="logo/villa_ventilj_logo.png">
      <img id="icon3d" src="icons/icona3d.png">
      <img id="closeIcon" src="icons/close.png">
      <img id="searchIcon" src="icons/search.png">
      <a-asset-item id="statuaZena" src="model/zena3d.glb"></a-asset-item>
      <audio id="bgmusic" src="audio/sottofondosala2.mp3" preload="auto" loop></audio>
    </a-assets>

    <!-- Panorama -->
    <a-sky src="#salazena360" rotation="0 0 0"></a-sky>

    <!-- Musica in autoplay -->
    <a-entity sound="src: #bgmusic; autoplay: true; loop: true; volume: 0.5"></a-entity>

    <!-- Link torna indietro -->
    <a-link href="museopagliaccetti.html"
            title="Torna indietro"
            image="#museopreview"
            position="-8 0 3"
            rotation="0 -80 0"></a-link>

    <!-- Icona 3D -->
    <a-image id="openZena3D" class="clickable" src="#icon3d"
             position="2 -1 -3" rotation="1 -30 0" scale="0.7 0.7 0.7"
             material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

    <!-- Icone Foto -->
    <a-image id="photoBtnA" class="clickable" src="#searchIcon"
             position="0 1 -3" rotation="1 -30 0" scale="0.6 0.6 0.6"
             material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

    <a-image id="photoBtnB" class="clickable" src="#searchIcon"
             position="0 -1 6" rotation="1 -15 0" scale="0.7 0.7 0.7"
             material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

    <a-image id="photoBtnC" class="clickable" src="#searchIcon"
             position="5 1 5" rotation="1 50 0" scale="0.6 0.6 0.6"
             material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

    <!-- CAMERA + Overlay -->
    <a-entity id="rig">
      <a-entity id="cam" camera look-controls position="0 1.6 0">

        <!-- Overlay Zena 3D -->
        <a-entity id="zenaOverlay" visible="false" position="0 0 -1">
          <a-plane id="zenaBg" width="2.5" height="2"
                   material="color: #000000; opacity: 0.0; transparent: true"></a-plane>

          <a-entity id="zenaModel" gltf-model="#statuaZena"
                    position="0 -0.2 0.2" rotation="0 30 0" scale="0.35 0.35 0.35"></a-entity>

          <a-text id="zenaCaption"
                  value="Zena la schiava, fusione in bronzo, 2009.\n(gesso, cm.90x64x55, 1870 ca)."
                  align="center" color="#ffffff" width="0.9"
                  position="0 -0.30 0.25"></a-text>

          <a-image id="closeZena3D" class="clickable" src="#closeIcon"
                   position="0 -0.47 0.2" scale="0.22 0.22 0.22"
                   material="shader: flat; transparent: true; alphaTest: 0.05; depthTest: false"></a-image>
        </a-entity>

        <!-- Overlay Foto A -->
        <a-entity id="ovA" visible="false" position="0 0 -1">
          <a-plane width="2.2" height="1.6" material="color:#000; opacity:0.0; transparent:true"></a-plane>
          <a-image src="foto/cenotafio.jpg" position="0 0.2 0.0"></a-image>
          <a-image class="clickable" src="#closeIcon" position="0 -0.5 0.3" scale="0.22 0.22 0.22"></a-image>
          <a-text value="Studio per il Cenotafio di De' Bartolomei, gesso, cm 107x64x20, 1873-1874 ca.\n(fusione in bronzo,2009)."
                  align="center" color="#ffffff" width="0.7" position="0 -0.30 0.25"></a-text>
        </a-entity>

        <!-- Overlay Foto B -->
        <a-entity id="ovB" visible="false" position="0 0 -1">
          <a-plane width="2.2" height="1.6" material="color:#000; opacity:0.0; transparent:true"></a-plane>
          <a-image src="foto/cenotafio2.jpg" position="0 0.3 0.01"></a-image>
          <a-image class="clickable" src="#closeIcon" position="0 -0.5 0.3" scale="0.24 0.24 0.24"></a-image>
          <a-text value="Studio per il Cenotafio di De' Bartolomei, gesso, cm 48x27x6, 1870 ca.\n(fusione postuma in bronzo,2009)."
                  align="center" color="#ffffff" width="0.7" position="0 -0.20 0.25"></a-text>
        </a-entity>

        <!-- Overlay Foto C -->
        <a-entity id="ovC" visible="false" position="0 0 -1">
          <a-plane width="2.2" height="1.6" material="color:#000; opacity:0.0; transparent:true"></a-plane>
          <a-image src="foto/cenotafio3.jpg" position="0 0.2 0.01"></a-image>
          <a-image class="clickable" src="#closeIcon" position="0 -0.5 0.3" scale="0.25 0.25 0.25"></a-image>
          <a-text value="Studio per il Cenotafio di De' Bartolomei, gesso, cm 106x40x22, 1873-1875 ca.\n(fusione postuma in bronzo,2009)."
                  align="center" color="#ffffff" width="0.7" position="0 -0.30 0.25"></a-text>
        </a-entity>

      </a-entity>
    </a-entity>

    <!-- Copertura treppiede + logo -->
    <a-entity position="10 -130 12">
      <a-cylinder radius="50" height="0.5" material="color: #ffffff; shader: flat; emissive: #ffffff"></a-cylinder>
      <a-image src="#logo" position="0 1 0" width="70" height="70" rotation="90 205 0" scale="-1 1 1"></a-image>
    </a-entity>

    <!-- Controller VR -->
    <a-entity id="leftHand" link-controls="hand: left"></a-entity>
    <a-entity id="rightHand" link-controls="hand: right"></a-entity>

  </a-scene>

  <!-- Script gestione overlay -->
  <script>
    // Overlay 3D Zena
    const openZena = document.getElementById('openZena3D');
    const closeZena = document.getElementById('closeZena3D');
    const zenaOverlay = document.getElementById('zenaOverlay');

    openZena.addEventListener('click', () => { zenaOverlay.setAttribute('visible', true); });
    closeZena.addEventListener('click', () => { zenaOverlay.setAttribute('visible', false); });

    // Overlay Foto A
    const btnA = document.getElementById('photoBtnA');
    const ovA = document.getElementById('ovA');
    const closeA = ovA.querySelector('a-image.clickable');
    btnA.addEventListener('click', () => { ovA.setAttribute('visible', true); });
    closeA.addEventListener('click', () => { ovA.setAttribute('visible', false); });

    // Overlay Foto B
    const btnB = document.getElementById('photoBtnB');
    const ovB = document.getElementById('ovB');
    const closeB = ovB.querySelector('a-image.clickable');
    btnB.addEventListener('click', () => { ovB.setAttribute('visible', true); });
    closeB.addEventListener('click', () => { ovB.setAttribute('visible', false); });

    // Overlay Foto C
    const btnC = document.getElementById('photoBtnC');
    const ovC = document.getElementById('ovC');
    const closeC = ovC.querySelector('a-image.clickable');
    btnC.addEventListener('click', () => { ovC.setAttribute('visible', true); });
    closeC.addEventListener('click', () => { ovC.setAttribute('visible', false); });
  </script>

</body>
</html>
