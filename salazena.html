<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visita - Sala 1</title>
  <meta name="description" content="Museo Pagliaccetti - Villa Ventilj Mosciano Sant'Angelo">

  <!-- A-Frame core -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Componenti -->
  <script src="js/components/aframe-tooltip-component.js"></script>
  <script src="js/components/camera-position.js"></script>
  <script src="js/components/link-controls.js"></script>
</head>
<body>
  <a-scene raycaster="far: 100; objects: .clickable, [link];" cursor="rayOrigin: mouse" camera-position environment>

    <!-- Asset -->
    <a-assets>
      <img id="museopreview" crossorigin="anonymous" src="foto/museopreview.jpg">
      <img id="salazena360" crossorigin="anonymous" src="foto/salazena360.jpeg">
      <img id="logo" crossorigin="anonymous" src="logo/villa_ventilj_logo.png">
      <img id="icon3d" src="icons/icona3d.png">
      <img id="closeIcon" src="icons/close.png">
      <img id="searchIcon" src="icons/search.png">
      <img id="musicIcon" src="icons/music.png">
      <a-asset-item id="statuaZena" src="model/zena3d.glb"></a-asset-item>
      <audio id="bgmusic" src="audio/sottofondosala2.mp3" preload="auto" loop></audio>
    </a-assets>

    <!-- Panorama -->
    <a-sky src="#salazena360" rotation="0 0 0"></a-sky>

    <!-- Link torna indietro -->
    <a-link href="museopagliaccetti.html" title="Torna indietro" image="#museopreview" position="-8 0 3" rotation="0 -80 0"></a-link>

    <!-- Icona in basso per aprire il modello 3D -->
    <a-image id="openZena3D" class="clickable" src="#icon3d" position="2 -1 -3" rotation="1 -30 0" scale="0.7 0.7 0.7" material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

    <!-- Tre icone APRI FOTO -->
    <a-image id="photoBtnA" class="clickable" src="#searchIcon" position="0 1 -3" rotation="1 -30 0" scale="0.6 0.6 0.6" material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>
    <a-image id="photoBtnB" class="clickable" src="#searchIcon" position="0 -1 6" rotation="1 -15 0" scale="0.7 0.7 0.7" material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>
    <a-image id="photoBtnC" class="clickable" src="#searchIcon" position="5 1 5" rotation="1 50 0" scale="0.6 0.6 0.6" material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

    <!-- Pulsante play/stop musica in alto a destra -->
    <a-image id="musicBtn" src="#musicIcon" class="clickable" 
             position="1.2 2 -1.5" scale="0.25 0.25 0.25" 
             material="shader: flat; transparent: true;"></a-image>

    <!-- CAMERA + OVERLAY MODELLO -->
    <a-entity id="rig">
      <a-entity id="cam" camera look-controls position="0 1.6 0">

        <!-- Overlay Zena (3D) -->
        <a-entity id="zenaOverlay" visible="false" position="0 0 -1">
          <a-plane id="zenaBg" width="2.5" height="2" material="color: #000000; opacity: 0.0; transparent: true"></a-plane>
          <a-entity id="zenaModel" gltf-model="#statuaZena" position="0 -0.2 0.2" rotation="0 30 0" scale="0.35 0.35 0.35"></a-entity>
          <a-text id="zenaCaption" value="Zena la schiava, fusione in bronzo, 2009.\n(gesso, cm.90x64x55, 1870 ca)." align="center" color="#ffffff" width="0.9" position="0 -0.30 0.25"></a-text>
          <a-image id="closeZena3D" class="clickable" src="#closeIcon" position="0 -0.47 0.2" scale="0.22 0.22 0.22" material="shader: flat; transparent: true; alphaTest: 0.05; depthTest: false"></a-image>
        </a-entity>

        <!-- OVERLAY FOTO A -->
        <a-entity id="ovA" visible="false" position="0 0 -1">
          <a-plane id="ovAbg" width="2.2" height="1.6" material="color:#000; opacity:0.0; transparent:true"></a-plane>
          <a-image id="ovAimg" src="foto/cenotafio.jpg" position="0 0.2 0.0"></a-image>
          <a-image id="ovAx" class="clickable" src="#closeIcon" position="0 0.5 0.3" scale="0.12 0.12 0.12"></a-image>
          <a-text id="ovAtext" value="Studio per il Cenotafio di De' Bartolomei, gesso, cm 107x64x20, 1873.1874 ca.\n(fusione in bronzo,2009)." align="center" color="#ffffff" width="0.7" position="0 -0.30 0.25"></a-text>
        </a-entity>

        <!-- OVERLAY FOTO B -->
        <a-entity id="ovB" visible="false" position="0 0 -1">
          <a-plane id="ovBbg" width="2.2" height="1.6" material="color:#000; opacity:0.0; transparent:true"></a-plane>
          <a-image id="ovBimg" src="foto/cenotafio2.jpg" position="0 0.3 0.01"></a-image>
          <a-image id="ovBx" class="clickable" src="#closeIcon" position="0 -0.3 0.4" scale="0.14 0.14 0.14"></a-image>
          <a-text id="ovBtext" value="Studio per il Cenotafio di De' Bartolomei, gesso, cm 48x27x6, 1870 ca.\n(fusione postuma in bronzo,2009)." align="center" color="#ffffff" width="0.7" position="0 -0.20 0.25"></a-text>
        </a-entity>

        <!-- OVERLAY FOTO C -->
        <a-entity id="ovC" visible="false" position="0 0 -1">
          <a-plane id="ovCbg" width="2.2" height="1.6" material="color:#000; opacity:0.0; transparent:true"></a-plane>
          <a-image id="ovCimg" src="foto/cenotafio3.jpg" position="0 0.2 0.01"></a-image>
          <a-image id="ovCx" class="clickable" src="#closeIcon" position="0 -0.4 0.4" scale="0.15 0.15 0.15"></a-image>
          <a-text id="ovCtext" value="Studio per il Cenotafio di De' Bartolomei, gesso, cm 106x40x22, 1873-1875 ca.\n(fusione postuma in bronzo,2009)." align="center" color="#ffffff" width="0.7" position="0 -0.30 0.25"></a-text>
        </a-entity>

      </a-entity>
    </a-entity>

    <!-- Copertura treppiede -->
    <a-entity position="10 -130 12" rotation="0 0 0">
      <a-cylinder radius="50" height="0.5" material="color: #ffffff; shader: flat; emissive: #ffffff"></a-cylinder>
      <a-entity position="0 1 0">
        <a-image src="#logo" position="0 0 0" width="70" height="70" rotation="90 205 0" scale="-1 1 1"></a-image>
      </a-entity>
    </a-entity>

    <!-- Controller VR -->
    <a-entity id="leftHand" link-controls="hand: left"></a-entity>
    <a-entity id="rightHand" link-controls="hand: right"></a-entity>

  </a-scene>

  <script>
    const cam = document.getElementById('cam');
    const soundEntity = document.getElementById('bgmusic');
    const musicBtn = document.getElementById('musicBtn');

    // Avvia la musica automaticamente
    soundEntity.play();

    // Toggle play/pause musica
    let musicPlaying = true;
    musicBtn.addEventListener('click', () => {
      if (musicPlaying) {
        soundEntity.pause();
        musicPlaying = false;
      } else {
        soundEntity.play();
        musicPlaying = true;
      }
    });

    /* -------- Overlay 3D: Zena (rotazione drag + zoom, blocco panorama) -------- */
    const btnOpenZ = document.getElementById('openZena3D');
    const ovZ = document.getElementById('zenaOverlay');
    const bgZ = document.getElementById('zenaBg');
    const btnCloseZ = document.getElementById('closeZena3D');
    const model = document.getElementById('zenaModel');

    btnOpenZ.addEventListener('click', () => {
      ovZ.setAttribute('visible', true);
      cam.components['look-controls']?.pause();
      bgZ.setAttribute('animation__fadein', 'property: material.opacity; from: 0; to: 0.95; dur: 250; easing: easeOutQuad');
    });

    btnCloseZ.addEventListener('click', () => {
      bgZ.setAttribute('animation__fadeout', 'property: material.opacity; from: 0.95; to: 0; dur: 220; easing: easeInQuad');
      setTimeout(() => {
        ovZ.setAttribute('visible', false);
        cam.components['look-controls']?.play();
      }, 220);
    });

    // Zoom (mouse wheel)
    window.addEventListener('wheel', (e) => {
      if (!ovZ.getAttribute('visible')) return;
      let s = model.getAttribute('scale').x;
      s = (e.deltaY < 0) ? s * 1.1 : s * 0.9;
      s = Math.min(Math.max(s, 0.2), 1.0);
      model.setAttribute('scale', `${s} ${s} ${s}`);
    }, {passive: true});

    // Pinch zoom (touch)
    let startDist = 0;
    window.addEventListener('touchstart', (e) => {
      if (!ovZ.getAttribute('visible')) return;
      if (e.touches.length === 2) {
        startDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, {passive: true});

    window.addEventListener('touchmove', (e) => {
      if (!ovZ.getAttribute('visible')) return;
      if (e.touches.length === 2 && startDist > 0) {
        const nd = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        let s = model.getAttribute('scale').x * (nd / startDist);
        s = Math.min(Math.max(s, 0.2), 1.0);
        model.setAttribute('scale', `${s} ${s} ${s}`);
        startDist = nd;
      }
    }, {passive: true});

    // Rotazione modello (drag)
    let dragging = false, lastX = 0, lastY = 0;
    function startDrag(x, y) { if (ovZ.getAttribute('visible')) { dragging = true; lastX = x; lastY = y; } }
    function moveDrag(x, y) { if (!dragging || !ovZ.getAttribute('visible')) return; const dx = x - lastX, dy = y - lastY; lastX = x; lastY = y; const r = model.getAttribute('rotation'); model.setAttribute('rotation', `${r.x - dy * 0.3} ${r.y + dx * 0.4} ${r.z}`); }
    function endDrag() { dragging = false; }
    window.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);
