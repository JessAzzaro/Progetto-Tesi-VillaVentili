<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visita - Sala 1</title>
  <meta name="description" content="Museo Pagliaccetti - Villa Ventilj Mosciano Sant'Angelo">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
<a-scene raycaster="far: 100; objects: .clickable, [link];" cursor="rayOrigin: mouse" camera-position environment>

  <a-assets>
    <img id="salazena360" src="foto/salazena360.jpeg">
    <img id="icon3d" src="icons/icona3d.png">
    <img id="closeIcon" src="icons/close.png">
    <img id="searchIcon" src="icons/search.png">
    <img id="musicIcon" src="icons/music.png">
    <a-asset-item id="statuaZena" src="model/zena3d.glb"></a-asset-item>
    <audio id="bgmusic" src="audio/sottofondosala2.mp3" preload="auto" loop></audio>
  </a-assets>

  <a-sky src="#salazena360"></a-sky>

  <!-- 3D Zena -->
  <a-entity id="rig">
    <a-entity id="cam" camera look-controls position="0 1.6 0">
      <a-entity id="zenaOverlay" visible="false" position="0 0 -1">
        <a-plane id="zenaBg" width="2.5" height="2" material="color: #000; opacity: 0; transparent: true"></a-plane>
        <a-entity id="zenaModel" gltf-model="#statuaZena" position="0 -0.2 0.2" rotation="0 30 0" scale="0.35 0.35 0.35"></a-entity>
        <a-text value="Zena la schiava, fusione in bronzo, 2009.\n(gesso, cm.90x64x55, 1870 ca)." align="center" color="#fff" width="0.9" position="0 -0.3 0.25"></a-text>
        <a-image id="closeZena3D" class="clickable" src="#closeIcon" position="0 -0.47 0.2" scale="0.22 0.22 0.22"></a-image>
      </a-entity>
    </a-entity>
  </a-entity>

  <!-- Icone -->
  <a-image id="openZena3D" class="clickable" src="#icon3d" position="2 -1 -3" scale="0.7 0.7 0.7"></a-image>
  <a-image id="musicBtn" src="#musicIcon" class="clickable" position="1.2 2 -1.5" scale="0.25 0.25 0.25"></a-image>

</a-scene>

<script>
  const cam = document.getElementById('cam');
  const soundEntity = document.getElementById('bgmusic');
  const musicBtn = document.getElementById('musicBtn');

  let musicPlaying = false;
  musicBtn.addEventListener('click', () => {
    if(musicPlaying){ soundEntity.pause(); musicPlaying=false; } 
    else{ soundEntity.play(); musicPlaying=true; }
  });

  // Overlay Zena 3D
  const btnOpenZ = document.getElementById('openZena3D');
  const ovZ = document.getElementById('zenaOverlay');
  const bgZ = document.getElementById('zenaBg');
  const btnCloseZ = document.getElementById('closeZena3D');
  const model = document.getElementById('zenaModel');

  btnOpenZ.addEventListener('click', ()=>{
    ovZ.setAttribute('visible',true);
    if(cam.components['look-controls']) cam.components['look-controls'].pause();
    bgZ.setAttribute('material','opacity:0.95');
  });

  btnCloseZ.addEventListener('click', ()=>{
    ovZ.setAttribute('visible',false);
    if(cam.components['look-controls']) cam.components['look-controls'].play();
  });

  // Drag & pinch
  let dragging=false,lastX=0,lastY=0,startDist=0;
  function startDrag(x,y){ dragging=true; lastX=x; lastY=y; }
  function moveDrag(x,y){ 
    if(!dragging) return; 
    const dx=x-lastX, dy=y-lastY; 
    lastX=x; lastY=y; 
    const r=model.getAttribute('rotation'); 
    model.setAttribute('rotation',`${r.x-dy*0.3} ${r.y+dx*0.4} ${r.z}`);
  }
  function endDrag(){ dragging=false; startDist=0; }

  window.addEventListener('mousedown', e=>startDrag(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>moveDrag(e.clientX,e.clientY));
  window.addEventListener('mouseup', endDrag);

  window.addEventListener('touchstart', e=>{
    if(e.touches.length===1) startDrag(e.touches[0].clientX,e.touches[0].clientY);
    if(e.touches.length===2){
      startDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    }
  }, {passive:true});

  window.addEventListener('touchmove', e=>{
    if(e.touches.length===1) moveDrag(e.touches[0].clientX,e.touches[0].clientY);
    if(e.touches.length===2 && startDist>0){
      const nd = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      let s = model.getAttribute('scale').x * (nd/startDist);
      s = Math.min(Math.max(s,0.2),1.0);
      model.setAttribute('scale', `${s} ${s} ${s}`);
      startDist = nd;
    }
  }, {passive:true});

  window.addEventListener('touchend', endDrag);
  window.addEventListener('touchcancel', endDrag);
  window.addEventListener('wheel', e=>{
    let s = model.getAttribute('scale').x;
    s = (e.deltaY<0)? s*1.1 : s*0.9;
    s = Math.min(Math.max(s,0.2),1.0);
    model.setAttribute('scale', `${s} ${s} ${s}`);
  });

</script>
</body>
</html>
