<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Visita - Sala 1</title>
    <meta name="description" content="Museo Pagliaccetti - Villa Ventilj Mosciano Sant'Angelo">

    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Componenti -->
    <script src="js/components/aframe-tooltip-component.js"></script>
    <script src="js/components/camera-position.js"></script>
    <script src="js/components/link-controls.js"></script>
  </head>
  <body>
    <a-scene
      raycaster="far: 100; objects: .clickable, [link];"
      cursor="rayOrigin: mouse"
      camera-position
      environment>

      <!-- Asset -->
      <a-assets>
        <img id="museopreview" crossorigin="anonymous" src="foto/museopreview.jpg">
        <img id="salazena360" crossorigin="anonymous" src="foto/salazena360.jpeg">
        <img id="logo" crossorigin="anonymous" src="logo/villa_ventilj_logo.png">
        <img id="icon3d" src="icons/icona3d.png">
        <img id="closeIcon" src="icons/close.png">

        <!-- icone e immagini per i tre overlay foto -->
        <img id="searchIcon" src="icons/search.png">
        <img id="phA" crossorigin="anonymous" src="foto/_A7A7376.jpg">
        <img id="phB" crossorigin="anonymous" src="foto/_A7A7378.jpg">
        <img id="phC" crossorigin="anonymous" src="foto/_A7A7379.jpg">

        <a-asset-item id="statuaZena" src="model/zena3d.glb"></a-asset-item>
      </a-assets>

      <!-- Panorama -->
      <a-sky src="#salazena360" rotation="0 0 0"></a-sky>

      <!-- Link torna indietro -->
      <a-link href="museopagliaccetti.html"
              title="Torna indietro"
              image="#museopreview"
              position="-8 0 3"
              rotation="0 -80 0"></a-link>

      <!-- Icona in basso per aprire il modello 3D -->
      <a-image id="openZena3D"
               class="clickable"
               src="#icon3d"
               position="2 -1 -3"
               rotation="1 -30 0"
               scale="0.7 0.7 0.7"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <!-- Tre icone APRI FOTO -->
      <a-image id="openPhotoA" class="clickable" src="#searchIcon"
               position="0 1 -3" rotation="1 -30 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <a-image id="openPhotoB" class="clickable" src="#searchIcon"
               position="-1.0 -1 -3" rotation="1 -30 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <a-image id="openPhotoC" class="clickable" src="#searchIcon"
               position="-2.5 -1 -3" rotation="1 -30 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <!-- CAMERA + OVERLAY MODELLO -->
      <a-entity id="rig">
        <a-entity id="cam" camera look-controls position="0 1.6 0">

          <!-- Overlay Zena (3D) -->
          <a-entity id="zenaOverlay" visible="false" position="0 0 -1">
            <a-plane id="zenaBg" width="2.5" height="2"
                     material="color: #000000; opacity: 0.0; transparent: true"></a-plane>

            <a-entity id="zenaModel"
                      gltf-model="#statuaZena"
                      position="0 -0.2 0.2"
                      rotation="0 30 0"
                      scale="0.35 0.35 0.35"></a-entity>

            <a-text id="zenaCaption"
                    value="Zena la schiava, fusione in bronzo, 2009.\n(gesso, cm.90x64x55, 1870 ca)."
                    align="center"
                    color="#ffffff"
                    width="0.9"
                    position="0 -0.30 0.25"></a-text>

            <a-image id="closeZena3D"
                     class="clickable"
                     src="#closeIcon"
                     position="0 -0.47 0.2"
                     scale="0.22 0.22 0.22"
                     material="shader: flat; transparent: true; alphaTest: 0.05; depthTest: false"></a-image>
          </a-entity>

          <!-- Overlay FOTO A -->
          <a-entity id="photoOverlayA" visible="false" position="0 0 -1">
            <a-plane id="photoBgA" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="photoImgA" src="#phA" position="0 0.10 0.01"
                     material="shader: flat; transparent: true"></a-image>

            <a-text value="Opera – Museo Raffaello Pagliaccetti"
                    align="center" color="#ffffff" width="1.6"
                    position="0 -0.45 0.02"></a-text>

            <a-image id="closePhotoA" class="clickable" src="#closeIcon"
                     position="0 -0.50 0.20" scale="0.22 0.22 0.22"
                     material="shader: flat; transparent: true; alphaTest: 0.05; depthTest:false"></a-image>
          </a-entity>

          <!-- Overlay FOTO B -->
          <a-entity id="photoOverlayB" visible="false" position="0 0 -1">
            <a-plane id="photoBgB" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="photoImgB" src="#phB" position="0 0.05 0.01"
                     material="shader: flat; transparent: true"></a-image>

            <a-text value="Opera – Museo Raffaello Pagliaccetti"
                    align="center" color="#ffffff" width="1.6"
                    position="0 -0.50 0.02"></a-text>

            <a-image id="closePhotoB" class="clickable" src="#closeIcon"
                     position="0 -0.55 0.19" scale="0.24 0.24 0.24"
                     material="shader: flat; transparent: true; alphaTest: 0.05; depth:false"></a-image>
          </a-entity>

          <!-- Overlay FOTO C -->
          <a-entity id="photoOverlayC" visible="false" position="0 0 -1">
            <a-plane id="photoBgC" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="photoImgC" src="#phC" position="0 0.05 0.01"
                     material="shader: flat; transparent: true"></a-image>

            <a-text value="Opera – Museo Raffaello Pagliaccetti"
                    align="center" color="#ffffff" width="1.6"
                    position="0 -0.46 0.02"></a-text>

            <a-image id="closePhotoC" class="clickable" src="#closeIcon"
                     position="0 -0.55 0.20" scale="0.22 0.22 0.22"
                     material="shader: flat; transparent: true; alphaTest: 0.05; depth:false"></a-image>
          </a-entity>

        </a-entity>
      </a-entity>

      <!-- Copertura treppiede -->
      <a-entity position="10 -130 12" rotation="0 0 0">
        <a-cylinder radius="50" height="0.5"
                    material="color: #ffffff; shader: flat; emissive: #ffffff"></a-cylinder>
        <a-entity position="0 1 0">
          <a-image src="#logo" position="0 0 0" width="70" height="70"
                   rotation="90 205 0" scale="-1 1 1"></a-image>
        </a-entity>
      </a-entity>

      <!-- Controller VR -->
      <a-entity id="leftHand" link-controls="hand: left"></a-entity>
      <a-entity id="rightHand" link-controls="hand: right"></a-entity>
    </a-scene>

    <script>
      const cam = document.getElementById('cam');

      /* -------- Overlay 3D: Zena (rotazione + zoom) -------- */
      const btnOpenZ  = document.getElementById('openZena3D');
      const ovZ       = document.getElementById('zenaOverlay');
      const bgZ       = document.getElementById('zenaBg');
      const btnCloseZ = document.getElementById('closeZena3D');
      const model     = document.getElementById('zenaModel');

      btnOpenZ.addEventListener('click', () => {
        ovZ.setAttribute('visible', true);
        cam.components['look-controls']?.pause();
        bgZ.setAttribute('animation__fadein',
          'property: material.opacity; from: 0; to: 0.95; dur: 250; easing: easeOutQuad');
      });

      btnCloseZ.addEventListener('click', () => {
        bgZ.setAttribute('animation__fadeout',
          'property: material.opacity; from: 0.95; to: 0; dur: 220; easing: easeInQuad');
        setTimeout(() => {
          ovZ.setAttribute('visible', false);
          cam.components['look-controls']?.play();
        }, 220);
      });

      // zoom (mouse wheel)
      window.addEventListener('wheel', (e) => {
        if (!ovZ.getAttribute('visible')) return;
        let s = model.getAttribute('scale').x;
        s = (e.deltaY < 0) ? s * 1.1 : s * 0.9;
        s = Math.min(Math.max(s, 0.2), 1.0);
        model.setAttribute('scale', `${s} ${s} ${s}`);
      }, {passive: true});

      // pinch zoom (touch)
      let startDist = 0;
      window.addEventListener('touchstart', (e) => {
        if (!ovZ.getAttribute('visible')) return;
        if (e.touches.length === 2) {
          startDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, {passive: true});

      window.addEventListener('touchmove', (e) => {
        if (!ovZ.getAttribute('visible')) return;
        if (e.touches.length === 2 && startDist > 0) {
          const nd = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          let s = model.getAttribute('scale').x * (nd / startDist);
          s = Math.min(Math.max(s, 0.2), 1.0);
          model.setAttribute('scale', `${s} ${s} ${s}`);
          startDist = nd;
        }
      }, {passive: true});

      // rotazione libera del modello (drag)
      let dragging = false, lastX = 0, lastY = 0;
      function startDrag(x, y) { if (ovZ.getAttribute('visible')) { dragging = true; lastX = x; lastY = y; } }
      function moveDrag(x, y) {
        if (!dragging || !ovZ.getAttribute('visible')) return;
        const dx = x - lastX, dy = y - lastY; lastX = x; lastY = y;
        const r = model.getAttribute('rotation');
        model.setAttribute('rotation', `${r.x - dy * 0.3} ${r.y + dx * 0.4} ${r.z}`);
      }
      function endDrag() { dragging = false; }

      window.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
      window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
      window.addEventListener('mouseup', endDrag);

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) { const t = e.touches[0]; startDrag(t.clientX, t.clientY); }
      }, {passive: true});
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) { const t = e.touches[0]; moveDrag(t.clientX, t.clientY); }
      }, {passive: true});
      window.addEventListener('touchend', endDrag);
      window.addEventListener('touchcancel', endDrag);

      /* -------- Overlay FOTO -------- */
      function setupPhotoOverlay(openId, overlayId, bgId, imgEntityId) {
        const openBtn = document.getElementById(openId);
        const ov      = document.getElementById(overlayId);
        const bg      = document.getElementById(bgId);
        const close   = ov.querySelector('.clickable[src="#closeIcon"]');
        const imgEnt  = document.getElementById(imgEntityId);

        openBtn.addEventListener('click', () => {
          ov.setAttribute('visible', true);
          cam.components['look-controls']?.pause();
          bg.setAttribute('animation__fadein',
            'property: material.opacity; from: 0; to: 0.95; dur: 250; easing: easeOutQuad');
        });

        close.addEventListener('click', () => {
          bg.setAttribute('animation__fadeout',
            'property: material.opacity; from: 0.95; to: 0; dur: 220; easing: easeInQuad');
          setTimeout(() => {
            ov.setAttribute('visible', false);
            cam.components['look-controls']?.play();
          }, 220);
        });

        // fit immagine
        const assetId = imgEnt.getAttribute('src');
        const asset   = document.querySelector(assetId);
        const maxW = 2.0, maxH = 1.3;

        const fit = () => {
          const w = asset.naturalWidth, h = asset.naturalHeight;
          if (!w || !h) return;
          const ar = w / h, boxAr = maxW / maxH;
          let W, H;
          if (ar > boxAr) { W = maxW; H = maxW / ar; }
          else            { H = maxH; W = maxH * ar; }
          imgEnt.setAttribute('width',  W.toFixed(3));
          imgEnt.setAttribute('height', H.toFixed(3));
        };
        if (asset.complete) fit(); else asset.addEventListener('load', fit);
      }

      setupPhotoOverlay('openPhotoA', 'photoOverlayA', 'photoBgA', 'photoImgA');
      setupPhotoOverlay('openPhotoB', 'photoOverlayB', 'photoBgB', 'photoImgB');
      setupPhotoOverlay('openPhotoC', 'photoOverlayC', 'photoBgC', 'photoImgC');
    </script>
  </body>
</html>
