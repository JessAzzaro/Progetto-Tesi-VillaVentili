<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Visita - Sala 1</title>
    <meta name="description" content="Museo Pagliaccetti - Villa Ventilj Mosciano Sant'Angelo">

    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Componenti -->
    <script src="js/components/aframe-tooltip-component.js"></script>
    <script src="js/components/camera-position.js"></script>
    <script src="js/components/link-controls.js"></script>
  </head>
  <body>
    <a-scene
      raycaster="far: 100; objects: .clickable, [link];"
      cursor="rayOrigin: mouse"
      camera-position
      environment>

      <!-- Asset -->
      <a-assets>
        <img id="museopreview" crossorigin="anonymous" src="foto/museopreview.jpg">
        <img id="salazena360" crossorigin="anonymous" src="foto/salazena360.jpeg">
        <img id="logo" crossorigin="anonymous" src="logo/villa_ventilj_logo.png">
        <img id="icon3d" src="icons/icona3d.png">
        <img id="closeIcon" src="icons/close.png">
        <a-asset-item id="statuaZena" src="model/zena3d.glb"></a-asset-item>
      </a-assets>

      <!-- Panorama -->
      <a-sky src="#salazena360" rotation="0 0 0"></a-sky>

      <!-- Link torna indietro -->
      <a-link href="museopagliaccetti.html"
              title="Torna indietro"
              image="#museopreview"
              position="-8 0 3"
              rotation="0 -80 0"></a-link>

      <!-- Icona in basso per aprire il modello -->
      <a-image id="openZena3D"
               class="clickable"
               src="#icon3d"
               position="2 -1 -3"
               rotation="1 -30 0"
               scale="0.7 0.7 0.7"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <!-- CAMERA + OVERLAY MODELLO -->
      <a-entity id="rig">
        <a-entity id="cam" camera look-controls position="0 1.6 0">

          <!-- Overlay Zena  -->
          <a-entity id="zenaOverlay" visible="false" position="0 0 -1">
            <!-- sfondo scuro con fade -->
            <a-plane id="zenaBg" width="2.5" height="2"
                     material="color: #000000; opacity: 0.0; transparent: true"></a-plane>

            <!-- modello al centro (con drag-rotate) -->
            <a-entity id="zenaModel"
                      gltf-model="#statuaZena"
                      position="0 -0.2 0.2"
                      rotation="0 30 0"
                      scale="0.35 0.35 0.35"
                      drag-rotate="speed: 0.25"></a-entity>

            <!-- X di chiusura in basso -->
            <a-image id="closeZena3D"
                     class="clickable"
                     src="#closeIcon"
                     position="0 -0.4 0.2"
                     scale="0.22 0.22 0.22"
                     material="shader: flat; transparent: true; alphaTest: 0.05; depthTest: false"></a-image>
          </a-entity>

        </a-entity>
      </a-entity>

      <!-- Copertura treppiede (forzata bianca con shader flat + emissive) -->
      <a-entity position="10 -130 12" rotation="0 0 0">
        <a-cylinder radius="50" height="0.5"
                    material="color: #ffffff; shader: flat; emissive: #ffffff"></a-cylinder>
        <a-entity position="0 1 0">
          <a-image src="#logo" position="0 0 0" width="70" height="70"
                   rotation="90 205 0" scale="-1 1 1"></a-image>
        </a-entity>
      </a-entity>

      <!-- Controller VR -->
      <a-entity id="leftHand" link-controls="hand: left"></a-entity>
      <a-entity id="rightHand" link-controls="hand: right"></a-entity>
    </a-scene>

    <script>
      // Overlay modello Zena 
      const btnOpen  = document.getElementById('openZena3D');
      const ov       = document.getElementById('zenaOverlay');
      const bg       = document.getElementById('zenaBg');
      const btnClose = document.getElementById('closeZena3D');

      btnOpen.addEventListener('click', () => {
        ov.setAttribute('visible', true);
        bg.setAttribute('animation__fadein',
          'property: material.opacity; from: 0; to: 0.95; dur: 250; easing: easeOutQuad');
      });

      btnClose.addEventListener('click', () => {
        bg.setAttribute('animation__fadeout',
          'property: material.opacity; from: 0.95; to: 0; dur: 220; easing: easeInQuad');
        setTimeout(() => ov.setAttribute('visible', false), 220);
      });

      // ---- Componente per ruotare con drag (mouse o touch) ----
      AFRAME.registerComponent('drag-rotate', {
        schema: { speed: {type: 'number', default: 0.25} },
        init: function () {
          this.dragging = false;
          this.startX = 0;
          this.startY = 0;
          this.startRot = {x:0, y:0};
          // bind
          this.onDown = this.onDown.bind(this);
          this.onMove = this.onMove.bind(this);
          this.onUp   = this.onUp.bind(this);

          const canvas = this.el.sceneEl.canvas;
          // In caso il canvas non sia pronto subito
          if (!canvas) {
            this.el.sceneEl.addEventListener('render-target-loaded', () => {
              this.addListeners(this.el.sceneEl.canvas);
            });
          } else {
            this.addListeners(canvas);
          }
        },
        addListeners: function (target) {
          target.addEventListener('pointerdown', this.onDown);
          window.addEventListener('pointermove', this.onMove);
          window.addEventListener('pointerup',   this.onUp);
        },
        remove: function () {
          const canvas = this.el.sceneEl && this.el.sceneEl.canvas;
          if (canvas) {
            canvas.removeEventListener('pointerdown', this.onDown);
          }
          window.removeEventListener('pointermove', this.onMove);
          window.removeEventListener('pointerup',   this.onUp);
        },
        onDown: function (e) {
          // ruota solo se l'overlay è visibile
          const overlayVisible = this.el.closest('#zenaOverlay')?.getAttribute('visible');
          if (!overlayVisible) return;

          this.dragging = true;
          this.startX = e.clientX;
          this.startY = e.clientY;
          const r = this.el.getAttribute('rotation');
          this.startRot = {x: r.x, y: r.y};
        },
        onMove: function (e) {
          if (!this.dragging) return;
          const dx = e.clientX - this.startX;
          const dy = e.clientY - this.startY;

          // aggiorna yaw con dx e pitch con dy (con clamp sul pitch)
          const yaw   = this.startRot.y + dx * this.data.speed;
          let   pitch = this.startRot.x - dy * (this.data.speed * 0.6);
          // limita l'inclinazione per non capovolgere
          pitch = Math.max(-45, Math.min(45, pitch));

          this.el.setAttribute('rotation', `${pitch} ${yaw} 0`);
        },
        onUp: function () { this.dragging = false; }
      });
    </script>
  </body>
</html>
