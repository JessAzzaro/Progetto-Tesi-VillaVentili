<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Visita - Sala 1</title>
    <meta name="description" content="Museo Pagliaccetti - Villa Ventilj Mosciano Sant'Angelo">

    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Componenti -->
    <script src="js/components/aframe-tooltip-component.js"></script>
    <script src="js/components/camera-position.js"></script>
    <script src="js/components/link-controls.js"></script>
  </head>
  <body>
    <a-scene
      raycaster="far: 100; objects: .clickable, [link];"
      cursor="rayOrigin: mouse"
      camera-position
      environment>

      <!-- Asset -->
      <a-assets>
        <img id="museopreview" crossorigin="anonymous" src="foto/museopreview.jpg">
        <img id="salazena360" crossorigin="anonymous" src="foto/salazena360.jpeg">
        <img id="logo" crossorigin="anonymous" src="logo/villa_ventilj_logo.png">
        <img id="icon3d" src="icons/icona3d.png">
        <img id="closeIcon" src="icons/close.png">
        <a-asset-item id="statuaZena" src="model/zena3d.glb"></a-asset-item>
      </a-assets>

      <!-- Panorama -->
      <a-sky src="#salazena360" rotation="0 0 0"></a-sky>

      <!-- Link torna indietro -->
      <a-link href="museopagliaccetti.html"
              title="Torna indietro"
              image="#museopreview"
              position="-8 0 3"
              rotation="0 -80 0"></a-link>

      <!-- Icona in basso per aprire il modello -->
      <a-image id="openZena3D"
               class="clickable"
               src="#icon3d"
               position="2 -1 -3"
               rotation="1 -30 0"
               scale="0.7 0.7 0.7"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <!-- CAMERA + OVERLAY MODELLO -->
      <a-entity id="rig">
        <a-entity id="cam" camera look-controls position="0 1.6 0">

          <!-- Overlay Zena -->
          <a-entity id="zenaOverlay" visible="false" position="0 0 -1">
            <!-- sfondo scuro -->
            <a-plane id="zenaBg" width="2.5" height="2"
                     material="color: #000000; opacity: 0.0; transparent: true"></a-plane>

            <!-- modello al centro -->
            <a-entity id="zenaModel"
                      gltf-model="#statuaZena"
                      position="0 -0.2 0.2"
                      rotation="0 30 0"
                      scale="0.35 0.35 0.35"></a-entity>

            <!-- Didascalia -->
            <a-text id="zenaCaption"
                    value="Zena la schiava, fusione in bronzo, 2009.\n(gesso, cm.90x64x55, 1870 ca)."
                    align="center"
                    color="#ffffff"
                    width="2.2"
                    position="0 -0.15 0.25"></a-text>

            <!-- X di chiusura -->
            <a-image id="closeZena3D"
                     class="clickable"
                     src="#closeIcon"
                     position="0 -0.45 0.2"
                     scale="0.22 0.22 0.22"
                     material="shader: flat; transparent: true; alphaTest: 0.05; depthTest: false"></a-image>
          </a-entity>

        </a-entity>
      </a-entity>

      <!-- Copertura treppiede -->
      <a-entity position="10 -130 12" rotation="0 0 0">
        <a-cylinder radius="50" height="0.5"
                    material="color: #ffffff; shader: flat; emissive: #ffffff"></a-cylinder>
        <a-entity position="0 1 0">
          <a-image src="#logo" position="0 0 0" width="70" height="70"
                   rotation="90 205 0" scale="-1 1 1"></a-image>
        </a-entity>
      </a-entity>

      <!-- Controller VR -->
      <a-entity id="leftHand" link-controls="hand: left"></a-entity>
      <a-entity id="rightHand" link-controls="hand: right"></a-entity>
    </a-scene>

    <script>
      const btnOpen  = document.getElementById('openZena3D');
      const ov       = document.getElementById('zenaOverlay');
      const bg       = document.getElementById('zenaBg');
      const btnClose = document.getElementById('closeZena3D');
      const model    = document.getElementById('zenaModel');

      // apertura overlay
      btnOpen.addEventListener('click', () => {
        ov.setAttribute('visible', true);
        bg.setAttribute('animation__fadein',
          'property: material.opacity; from: 0; to: 0.95; dur: 250; easing: easeOutQuad');
      });

      // chiusura overlay
      btnClose.addEventListener('click', () => {
        bg.setAttribute('animation__fadeout',
          'property: material.opacity; from: 0.95; to: 0; dur: 220; easing: easeInQuad');
        setTimeout(() => ov.setAttribute('visible', false), 220);
      });

      // ZOOM con mouse wheel
      window.addEventListener('wheel', (e) => {
        if (!ov.getAttribute('visible')) return;
        let scale = model.getAttribute('scale').x;
        if (e.deltaY < 0) scale *= 1.1;  // zoom in
        else scale *= 0.9;              // zoom out
        scale = Math.min(Math.max(scale, 0.2), 1.0); // limiti
        model.setAttribute('scale', `${scale} ${scale} ${scale}`);
      });

      // ZOOM con pinch (touch)
      let startDist = 0;
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          startDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (!ov.getAttribute('visible') || e.touches.length !== 2) return;
        const newDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        let scale = model.getAttribute('scale').x * (newDist / startDist);
        scale = Math.min(Math.max(scale, 0.2), 1.0);
        model.setAttribute('scale', `${scale} ${scale} ${scale}`);
        startDist = newDist;
      });
    </script>
  </body>
</html>
