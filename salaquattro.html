<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Visita – Sala 4</title>
    <meta name="description" content="Museo Pagliaccetti – Villa Ventilj Mosciano Sant'Angelo">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Componenti opzionali  -->
    <script src="js/components/aframe-tooltip-component.js"></script>
    <script src="js/components/camera-position.js"></script>
    <script src="js/components/link-controls.js"></script>

    <style>
      #audioToggle{
        position:absolute; top:10px; right:10px; background:#fff; border-radius:50%;
        padding:10px; cursor:pointer; user-select:none; box-shadow:0 2px 8px rgba(0,0,0,.2);
        font-size:18px; line-height:1;
      }
    </style>
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse"
             raycaster="far: 100; objects: .clickable, [link];"
             camera-position
             environment>

      <!-- ASSETS -->
      <a-assets>
        <!-- Panorami e preview -->
        <img id="museopreview" crossorigin="anonymous" src="foto/museopreview.jpg">
        <img id="salaquattro360_1" crossorigin="anonymous" src="foto/salaquattro360_1.jpeg">
        <img id="salaquattro360_2" crossorigin="anonymous" src="foto/salaquattro360_2.jpeg">
        <img id="logo" crossorigin="anonymous" src="logo/villa_ventilj_logo.png">
        <img id="salaciquepreview" crossorigin="anonymous" src="foto/salacinquepreview.jpg">

        <!-- Icone -->
        <img id="cambio360" src="icons/cambio360.png">
        <img id="searchIcon" src="icons/search.png">
        <img id="icon3d"    src="icons/icona3d.png">
        <img id="closeIcon" src="icons/close.png">
        <img id="arrowL"    src="icons/arrowleft.png">
        <img id="arrowR"    src="icons/arrowright.png">

        <!-- Modelli 3D -->
        <a-asset-item id="galileo3D"  src="model/galileo3d.glb"></a-asset-item>
        <a-asset-item id="pasquale3D" src="model/pasquale3d.glb"></a-asset-item>

        <!-- Galleria 1: virile1..8 -->
        <img id="virile1" src="foto/virile1.jpg">
        <img id="virile2" src="foto/virile2.jpg">
        <img id="virile3" src="foto/virile3.jpg">
        <img id="virile4" src="foto/virile4.jpg">
        <img id="virile5" src="foto/virile5.jpg">
        <img id="virile6" src="foto/virile6.jpg">
        <img id="virile7" src="foto/virile7.jpg">
        <img id="virile8" src="foto/virile8.jpg">

        <!-- Galleria 2: andrea1..4 -->
        <img id="andrea1" src="foto/andrea1.jpg">
        <img id="andrea2" src="foto/andrea2.jpg">
        <img id="andrea3" src="foto/andrea3.jpg">
        <img id="andrea4" src="foto/andrea4.jpg">

        <!-- Audio (stessa musica delle sale precedenti) -->
        <audio id="bgSala4" src="audio/sottofondosala2.mp3" preload="auto"></audio>
      </a-assets>

      <!-- PANORAMA (switch con icona) -->
      <a-sky id="sky" src="#salaquattro360_1" rotation="0 0 0" material="shader: flat"></a-sky>

      <a-image id="nextView"
               class="clickable"
               src="#cambio360"
               position="-4 3 -6"
               scale="0.6 0.6 0.6"
               rotation="0 30 0"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <!-- Musica di sottofondo -->
      <a-entity id="backgroundSound"
                sound="src: #bgSala4; autoplay: true; loop: true; volume: 0.8"></a-entity>

      <!-- Link stanze -->
      <a-link href="salatre.html"
              title="Torna indietro – Sala 3"
              image="#museopreview"
              position="6 0 -2"
              rotation="0 -60 0"></a-link>

      <a-link href="salacinque.html"
              title="Visita – Sala 5"
              image="#salaciquepreview"
              position="-5 1 6"
              rotation="0 -50 0"></a-link>

      <!-- Copertura treppiede + logo -->
      <a-entity position="10 -180 12">
        <a-cylinder radius="50" height="0.5"
                    material="color: #ffffff; shader: flat; emissive: #ffffff"></a-cylinder>
        <a-image src="#logo" position="0 1 0" width="70" height="70"
                 rotation="90 205 0" scale="-1 1 1"></a-image>
      </a-entity>

      <!-- ICONE: 2 modelli 3D + 2 gallerie -->
      <a-image id="open3DGalileo" class="clickable" src="#icon3d"
               position="-4 0 -1" rotation="0 40 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <a-image id="open3DPasquale" class="clickable" src="#icon3d"
               position="5 0 2" rotation="0 50 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <a-image id="openVirile" class="clickable" src="#searchIcon"
               position="0 -20 0" rotation="0 -20 0" scale="0.9 0.9 0.9"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <a-image id="openAndrea" class="clickable" src="#searchIcon"
               position="-2 0.5 7" rotation="0 -10 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <!-- CAMERA + OVERLAY -->
      <a-entity id="rig">
        <a-entity id="cam" camera look-controls position="0 1.6 0">

          <!-- Overlay 3D: Galileo -->
          <a-entity id="ovGalileo" visible="false" position="0 0 -2">
            <a-plane id="bgGalileo" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-entity id="galileoModel"
                      gltf-model="#galileo3D"
                      position="0 0.2 0.2"
                      rotation="0 30 0"
                      scale="1 1 1"></a-entity>

            <a-text value="Galileo Galilei, gesso, cm73x65x30, 1864 ca.\n(fusione postuma in bronzo, 2009)"
                    align="center" color="#fff" width="1.6"
                    position="0 -0.32 0.22"></a-text>

            <a-image id="closeGalileo" class="clickable" src="#closeIcon"
                     position="0 -0.60 0.22" scale="0.22 0.22 0.22"
                     material="shader: flat; transparent: true; alphaTest:0.05; depthTest:false"></a-image>
          </a-entity>

          <!-- Overlay 3D: Pasquale -->
          <a-entity id="ovPasquale" visible="false" position="0 0 -2">
            <a-plane id="bgPasquale" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-entity id="pasqualeModel"
                      gltf-model="#pasquale3D"
                      position="0 0.2 0.2"
                      rotation="0 -20 0"
                      scale="1 1 1"></a-entity>

            <a-text value="Pasquale Ventilj in uniforme, gesso patinato, cm.71x40x29.5, 1880-1890 ca.\n(fusione postuma in bronzo, 2009)"
                    align="center" color="#fff" width="1.6"
                    position="0 -0.32 0.22"></a-text>

            <a-image id="closePasquale" class="clickable" src="#closeIcon"
                     position="0 -0.60 0.30" scale="0.22 0.22 0.22"
                     material="shader: flat; transparent: true; alphaTest:0.05; depthTest:false"></a-image>
          </a-entity>

          <!-- Overlay Galleria: VIRILE (8 img) -->
          <a-entity id="ovVirile" visible="false" position="0 0 -2">
            <a-plane id="bgVirile" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="imgVirile" src="#virile1" position="0 0.06 0.02"></a-image>

            <a-image id="prevVirile" class="clickable" src="#arrowL"
                     position="-0.7 -0.28 0.15" scale="0.18 0.18 0.18"
                     material="shader: flat; transparent: true; alphaTest:0.05"></a-image>
            <a-image id="nextVirile" class="clickable" src="#arrowR"
                     position="0.7 -0.28 0.15" scale="0.18 0.18 0.18"
                     material="shader: flat; transparent: true; alphaTest:0.05"></a-image>

            <a-text id="countVirile" value="1/8"
                    align="center" color="#bbb" width="01"
                    position="0 0.80 0.02"></a-text>

            <a-text value="Busto virile togato, gesso, cm.75x60x35, 1880ca.\n(fusione postuma in bronzo, 2009)"
                    align="center" color="#fff" width="1.6"
                    position="0 -0.70 0.02"></a-text>

            <a-image id="closeVirile" class="clickable" src="#closeIcon"
                     position="0 -0.90 0.25" scale="0.24 0.24 0.24"
                     material="shader: flat; transparent: true; alphaTest:0.05; depthTest:false"></a-image>
          </a-entity>

          <!-- Overlay Galleria: ANDREA (4 img) -->
          <a-entity id="ovAndrea" visible="false" position="0 0 -2">
            <a-plane id="bgAndrea" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="imgAndrea" src="#andrea1" position="0 0.06 0.02"></a-image>

            <a-image id="prevAndrea" class="clickable" src="#arrowL"
                     position="-0.7 -0.28 0.15" scale="0.18 0.18 0.18"
                     material="shader: flat; transparent: true; alphaTest:0.05"></a-image>
            <a-image id="nextAndrea" class="clickable" src="#arrowR"
                     position="0.7 -0.28 0.15" scale="0.18 0.18 0.18"
                     material="shader: flat; transparent: true; alphaTest:0.05"></a-image>

            <a-text id="countAndrea" value="1/4"
                    align="center" color="#bbb" width="01"
                    position="0 0.80 0.02"></a-text>

            <a-text value="Serie 'Andrea' – didascalia provvisoria"
                    align="center" color="#fff" width="1.6"
                    position="0 -0.70 0.02"></a-text>

            <a-image id="closeAndrea" class="clickable" src="#closeIcon"
                     position="0 -0.85 0.25" scale="0.24 0.24 0.24"
                     material="shader: flat; transparent: true; alphaTest:0.05; depthTest:false"></a-image>
          </a-entity>

        </a-entity>
      </a-entity>
    </a-scene>

    <!-- Toggle audio -->
    <div id="audioToggle">🔊</div>

    <script>
      const cam = document.getElementById('cam');

      /* ===== Switch panorami ===== */
      (function(){
        const sky = document.getElementById('sky');
        const nextView = document.getElementById('nextView');
        let current = 1;
        nextView.addEventListener('click', () => {
          current = (current === 1) ? 2 : 1;
          sky.setAttribute('src', current === 1 ? '#salaquattro360_1' : '#salaquattro360_2');
        });
      })();

      /* ===== Audio BG toggle ===== */
      (function(){
        const audioToggle = document.getElementById('audioToggle');
        const backgroundSound = document.getElementById('backgroundSound');
        const bgSound = () => backgroundSound?.components?.sound;
        let isSoundOn = true;

        audioToggle.addEventListener('click', () => {
          if (!bgSound()) return;
          isSoundOn = !isSoundOn;
          if (isSoundOn) { bgSound().playSound(); audioToggle.textContent = '🔊'; }
          else           { bgSound().pauseSound(); audioToggle.textContent = '🔇'; }
        });
      })();

      /* ===== Helper: fit immagine nell'overlay ===== */
      function fitToBox(assetSelector, imgEntityId, maxW=2.0, maxH=1.3){
        const asset=document.querySelector(assetSelector);
        const img=document.getElementById(imgEntityId);
        if(!asset) return;
        const ready=()=>{
          const w=asset.naturalWidth, h=asset.naturalHeight; if(!w||!h) return;
          const ar=w/h, boxAr=maxW/maxH;
          let W,H; if(ar>boxAr){ W=maxW; H=maxW/ar; } else { H=maxH; W=maxH*ar; }
          img.setAttribute('width',W.toFixed(3));
          img.setAttribute('height',H.toFixed(3));
        };
        if(asset.complete) ready(); else asset.addEventListener('load', ready, {once:true});
      }

      /* ===== Overlay MODELLO 3D (open/close + zoom + drag rotate) ===== */
      function setupModelOverlay(openId, overlayId, bgId, closeId, modelId){
        const openBtn=document.getElementById(openId);
        const ov=document.getElementById(overlayId);
        const bg=document.getElementById(bgId);
        const close=document.getElementById(closeId);
        const model=document.getElementById(modelId);

        openBtn.addEventListener('click', ()=>{
          ov.setAttribute('visible', true);
          cam.components['look-controls']?.pause();
          bg.setAttribute('animation__fadein',
            'property: material.opacity; from: 0; to: 0.95; dur: 250; easing: easeOutQuad');
        });

        close.addEventListener('click', ()=>{
          bg.setAttribute('animation__fadeout',
            'property: material.opacity; from: 0.95; to: 0; dur: 220; easing: easeInQuad');
          setTimeout(()=>{
            ov.setAttribute('visible', false);
            cam.components['look-controls']?.play();
          }, 220);
        });

        // zoom (wheel)
        window.addEventListener('wheel', (e) => {
          if (!ov.getAttribute('visible')) return;
          let s = model.getAttribute('scale').x;
          s = (e.deltaY < 0) ? s * 1.1 : s * 0.9;
          s = Math.min(Math.max(s, 0.2), 1.2);
          model.setAttribute('scale', `${s} ${s} ${s}`);
        }, {passive:true});

        // pinch (touch)
        let pinchStart = 0;
        window.addEventListener('touchstart', (e) => {
          if (!ov.getAttribute('visible')) return;
          if (e.touches.length === 2) {
            pinchStart = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
          }
        }, {passive:true});
        window.addEventListener('touchmove', (e) => {
          if (!ov.getAttribute('visible')) return;
          if (e.touches.length === 2 && pinchStart > 0) {
            const nd = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            let s = model.getAttribute('scale').x * (nd / pinchStart);
            s = Math.min(Math.max(s, 0.2), 1.2);
            model.setAttribute('scale', `${s} ${s} ${s}`);
            pinchStart = nd;
          }
        }, {passive:true});

        // drag rotate (libero)
        let dragging=false, lastX=0, lastY=0;
        function startDrag(x,y){ if(ov.getAttribute('visible')){ dragging=true; lastX=x; lastY=y; } }
        function doDrag(x,y){
          if(!dragging || !ov.getAttribute('visible')) return;
          const dx=x-lastX, dy=y-lastY; lastX=x; lastY=y;
          const r=model.getAttribute('rotation');
          model.setAttribute('rotation', `${r.x - dy*0.3} ${r.y + dx*0.4} ${r.z}`);
        }
        function endDrag(){ dragging=false; }

        window.addEventListener('mousedown', e=>startDrag(e.clientX,e.clientY));
        window.addEventListener('mousemove', e=>doDrag(e.clientX,e.clientY));
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchstart', e=>{ if(e.touches.length===1){ const t=e.touches[0]; startDrag(t.clientX,t.clientY);} }, {passive:true});
        window.addEventListener('touchmove',  e=>{ if(e.touches.length===1){ const t=e.touches[0]; doDrag(t.clientX,t.clientY);} }, {passive:true});
        window.addEventListener('touchend', endDrag);
        window.addEventListener('touchcancel', endDrag);
      }

      setupModelOverlay('open3DGalileo','ovGalileo','bgGalileo','closeGalileo','galileoModel');
      setupModelOverlay('open3DPasquale','ovPasquale','bgPasquale','closePasquale','pasqualeModel');

      /* ===== Caroselli immagine (Virile / Andrea) ===== */
      const galleries = {
        virile: { ids: ['#virile1','#virile2','#virile3','#virile4','#virile5','#virile6','#virile7','#virile8'], idx:0, imgEnt:'imgVirile', countEnt:'countVirile' },
        andrea: { ids: ['#andrea1','#andrea2','#andrea3','#andrea4'], idx:0, imgEnt:'imgAndrea', countEnt:'countAndrea' }
      };

      function updateGallery(gKey){
        const g = galleries[gKey];
        const imgEnt = document.getElementById(g.imgEnt);
        const countEnt = document.getElementById(g.countEnt);
        const srcId = g.ids[g.idx];
        imgEnt.setAttribute('src', srcId);
        countEnt.setAttribute('value', `${g.idx+1}/${g.ids.length}`);
        fitToBox(srcId, g.imgEnt);
      }

      function setupPhotoOverlayWithCarousel(openId, overlayId, bgId, closeId, gKey, prevId, nextId){
        const openBtn=document.getElementById(openId);
        const ov=document.getElementById(overlayId);
        const bg=document.getElementById(bgId);
        const close=document.getElementById(closeId);
        const prev=document.getElementById(prevId);
        const next=document.getElementById(nextId);

        openBtn.addEventListener('click', ()=>{
          ov.setAttribute('visible', true);
          cam.components['look-controls']?.pause();
          bg.setAttribute('animation__fadein','property: material.opacity; from:0; to:0.95; dur:250; easing:easeOutQuad');
          updateGallery(gKey);
        });

        close.addEventListener('click', ()=>{
          bg.setAttribute('animation__fadeout','property: material.opacity; from:0.95; to:0; dur:220; easing:easeInQuad');
          setTimeout(()=>{ ov.setAttribute('visible',false); cam.components['look-controls']?.play(); },220);
        });

        prev.addEventListener('click', ()=>{
          const g=galleries[gKey];
          g.idx=(g.idx - 1 + g.ids.length) % g.ids.length;
          updateGallery(gKey);
        });

        next.addEventListener('click', ()=>{
          const g=galleries[gKey];
          g.idx=(g.idx + 1) % g.ids.length;
          updateGallery(gKey);
        });
      }

      setupPhotoOverlayWithCarousel('openVirile','ovVirile','bgVirile','closeVirile','virile','prevVirile','nextVirile');
      setupPhotoOverlayWithCarousel('openAndrea','ovAndrea','bgAndrea','closeAndrea','andrea','prevAndrea','nextAndrea');
    </script>
  </body>
</html>
