<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Museo Pagliaccetti</title>
    <meta name="description" content="Museo Pagliaccetti - Villa Ventilj Mosciano Sant'Angelo">

    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Componenti opzionali che già usi altrove -->
    <script src="js/components/aframe-tooltip-component.js"></script>
    <script src="js/components/camera-position.js"></script>
    <script src="js/components/link-controls.js"></script>

    <style>
      #audioToggle{
        position:absolute; top:10px; right:10px; background:#fff;
        padding:10px; border-radius:50%; cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.3); font-size:18px;
        user-select:none;
      }
    </style>
  </head>
  <body>
    <a-scene raycaster="far: 100; objects: .clickable, [link];"
             cursor="rayOrigin: mouse"
             camera-position
             environment>

      <!-- ASSET -->
      <a-assets>
        <!-- panorami e preview -->
        <img id="saladuepreview" crossOrigin="anonymous" src="foto/disperatopreview.jpg">
        <img id="museoingresso"  crossOrigin="anonymous" src="foto/museo_ingresso.jpeg">
        <img id="salazenapreview" crossOrigin="anonymous" src="foto/zenapreview.jpg">
        <img id="logo" crossOrigin="anonymous" src="logo/villa_ventilj_logo.png">

        <!-- icone -->
        <img id="searchIcon" src="icons/search.png">
        <img id="closeIcon"  src="icons/close.png">

        <!-- foto di dettaglio  -->
        <img id="ph7260" src="foto/_A7A7260.jpg">
        <img id="ph7261" src="foto/_A7A7261.jpg">
        <img id="ph7263" src="foto/_A7A7263.jpg">
        <img id="ph7264" src="foto/_A7A7264.jpg">

        <!-- audio -->
        <audio id="bgMuseo" src="audio/sottofondomuseo.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Panorama -->
      <a-sky src="#museoingresso" rotation="0 0 0"></a-sky>

      <!-- Musica di sottofondo -->
      <a-entity id="bgAudio" sound="src: #bgMuseo; autoplay: true; loop: true; volume: 0.8"></a-entity>

      <!-- Link al piano nobile -->
      <a-link href="pianonobile.html"
              title="Torna indietro"
              image="#museoingresso"
              position="1 0 10"
              rotation="0 20 0"></a-link>

      <!-- Link Sala 1 -->
      <a-link href="salazena.html"
              title="Visita - Sala 1"
              image="#salazenapreview"
              position="4 0 -4"
              rotation="0 -20 0"></a-link>

      <!-- Link Sala 2 -->
      <a-link href="saladue.html"
              title="Visita - Sala 2"
              image="#saladuepreview"
              position="-7 0 0"
              rotation="0 90 0"></a-link>

      <!-- Icone foto -->
      <a-image id="photoBtn1" class="clickable" src="#searchIcon"
               position="-3 1.6 6" rotation="0 15 0" scale="0.45 0.45 0.45"></a-image>

      <a-image id="photoBtn2" class="clickable" src="#searchIcon"
               position="0 1.8 -4.5" rotation="0 0 0" scale="0.45 0.45 0.45"></a-image>

      <a-image id="photoBtn3" class="clickable" src="#searchIcon"
               position="2 1.6 -3.8" rotation="0 -15 0" scale="0.45 0.45 0.45"></a-image>

      <a-image id="photoBtn4" class="clickable" src="#searchIcon"
               position="3 1.7 1.5" rotation="0 -60 0" scale="0.45 0.45 0.45"></a-image>

      <!-- Copertura treppiede -->
      <a-entity position="10 -180 12">
        <a-cylinder radius="50" height="0.5" color="#ffffff"></a-cylinder>
        <a-image src="#logo" position="0 1 0" width="70" height="70"
                 rotation="90 205 0" scale="-1 1 1"></a-image>
      </a-entity>

      <!-- Controller VR -->
      <a-entity id="leftHand" link-controls="hand: left"></a-entity>
      <a-entity id="rightHand" link-controls="hand: right"></a-entity>

      <!-- CAMERA + OVERLAY FOTO -->
      <a-entity id="rig">
        <a-entity id="cam" camera look-controls position="0 1.6 0">

          <!-- Overlay 1 (ph7260) -->
<a-entity id="ov1" visible="false" position="0 0 -1">
  <a-plane id="ov1bg" width="2.2" height="1.6"
           material="color:#000; opacity:0.0; transparent:true"></a-plane>
  <a-image id="ov1img" src="#ph7260" position="0 0 0.01"
           material="shader: flat; transparent: true"></a-image>
  <a-image id="ov1x" class="clickable" src="#closeIcon"
           position="0 -0.5 0.2" scale="0.20 0.20 0.20"></a-image>
</a-entity>

<!-- Overlay 2 (ph7261) -->
<a-entity id="ov2" visible="false" position="0 0 -1">
  <a-plane id="ov2bg" width="2.2" height="1.6"
           material="color:#000; opacity:0.0; transparent:true"></a-plane>
  <a-image id="ov2img" src="#ph7261" position="0 0 0.01"
           material="shader: flat; transparent: true"></a-image>
  <a-image id="ov2x" class="clickable" src="#closeIcon"
           position="0 -0.5 0.2" scale="0.22 0.22 0.22"></a-image>
</a-entity>

<!-- Overlay 3 (ph7263) -->
<a-entity id="ov3" visible="false" position="0 0 -1">
  <a-plane id="ov3bg" width="2.2" height="1.6"
           material="color:#000; opacity:0.0; transparent:true"></a-plane>
  <a-image id="ov3img" src="#ph7263" position="0 0 0.01"
           material="shader: flat; transparent: true"></a-image>
  <a-image id="ov3x" class="clickable" src="#closeIcon"
           position="0 -0.5 0.2" scale="0.21 0.21 0.21"></a-image>
</a-entity>

<!-- Overlay 4 (ph7264) -->
<a-entity id="ov4" visible="false" position="0 0 -1">
  <a-plane id="ov4bg" width="2.2" height="1.6"
           material="color:#000; opacity:0.0; transparent:true"></a-plane>
  <a-image id="ov4img" src="#ph7264" position="0 0 0.01"
           material="shader: flat; transparent: true"></a-image>
  <a-image id="ov4x" class="clickable" src="#closeIcon"
           position="0 -0.5 0.3" scale="0.21 0.21 0.21"></a-image>
</a-entity>

        </a-entity>
      </a-entity>
    </a-scene>

    <!-- Toggle audio -->
    <div id="audioToggle">🔊</div>

    <script>
      // Toggle audio bg
      const audioToggle = document.getElementById('audioToggle');
      const bgAudioEnt  = document.getElementById('bgAudio');
      const bgSound     = () => bgAudioEnt?.components?.sound;
      let bgOn = true;

      audioToggle.addEventListener('click', () => {
        bgOn = !bgOn;
        if (!bgSound()) return;
        if (bgOn) { bgSound().playSound(); audioToggle.textContent = '🔊'; }
        else      { bgSound().pauseSound(); audioToggle.textContent = '🔇'; }
      });

      // Funzione generica per overlay
      function setupOverlay(btnId, ovId, bgId, xId){
        const btn = document.getElementById(btnId);
        const ov  = document.getElementById(ovId);
        const bg  = document.getElementById(bgId);
        const x   = document.getElementById(xId);

        btn.addEventListener('click', () => {
          ov.setAttribute('visible', true);
          bg.setAttribute('animation__fadein',
            'property: material.opacity; from: 0; to: 0.95; dur: 250');
        });

        x.addEventListener('click', () => {
          bg.setAttribute('animation__fadeout',
            'property: material.opacity; from: 0.95; to: 0; dur: 220');
          setTimeout(() => ov.setAttribute('visible', false), 220);
        });
      }

      // Adattamento proporzioni immagine all'overlay (no deformazioni)
      function fitImageToBox(assetSelector, imgEntityId, maxW=2.0, maxH=1.3){
        const asset = document.querySelector(assetSelector);
        const img   = document.getElementById(imgEntityId);
        const onReady = () => {
          const w = asset.naturalWidth, h = asset.naturalHeight;
          if (!w || !h) return;
          const ar = w/h, boxAr = maxW/maxH;
          let targetW, targetH;
          if (ar > boxAr) { targetW = maxW; targetH = maxW/ar; }
          else            { targetH = maxH; targetW = maxH*ar; }
          img.setAttribute('width',  targetW.toFixed(3));
          img.setAttribute('height', targetH.toFixed(3));
        };
        if (asset.complete) onReady(); else asset.addEventListener('load', onReady);
      }

      // Attiva i 4 overlay foto
      setupOverlay('photoBtn1','ov1','ov1bg','ov1x');
      setupOverlay('photoBtn2','ov2','ov2bg','ov2x');
      setupOverlay('photoBtn3','ov3','ov3bg','ov3x');
      setupOverlay('photoBtn4','ov4','ov4bg','ov4x');

      // Fit immagini nei 4 overlay (asset = lo stesso usato nell'overlay)
      fitImageToBox('#ph7260','ov1img');
      fitImageToBox('#ph7261','ov2img');
      fitImageToBox('#ph7263','ov3img');
      fitImageToBox('#ph7264','ov4img');
    </script>
  </body>
</html>
