<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Visita – Sala 3</title>
    <meta name="description" content="Museo Pagliaccetti – Villa Ventilj Mosciano Sant'Angelo">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script src="js/components/aframe-tooltip-component.js"></script>
    <script src="js/components/camera-position.js"></script>
    <script src="js/components/link-controls.js"></script>

    <style>
      #audioToggle{
        position:absolute; top:10px; right:10px; background:#fff; border-radius:50%;
        padding:10px; cursor:pointer; user-select:none; box-shadow:0 2px 8px rgba(0,0,0,.2);
        font-size:18px; line-height:1;
      }
    </style>
  </head>
  <body>
    <a-scene
      raycaster="far: 100; objects: .clickable, [link];"
      cursor="rayOrigin: mouse"
      camera-position
      environment>

      <!-- ASSET -->
      <a-assets>
        <!-- Panorama e preview -->
        <img id="museopreview" crossorigin="anonymous" src="foto/museopreview.jpg">
        <img id="salatre360"  crossorigin="anonymous" src="foto/salatre360.jpeg">
        <img id="logo"        crossorigin="anonymous" src="logo/villa_ventilj_logo.png">

        <!-- Icone -->
        <img id="searchIcon" src="icons/search.png">
        <img id="closeIcon"  src="icons/close.png">

        <!-- 5 immagini della sala -->
        <img id="s3img1" src="foto/salatre1.jpg">
        <img id="s3img2" src="foto/salatre2.jpg">
        <img id="s3img3" src="foto/salatre3.jpg">
        <img id="s3img4" src="foto/salatre4.jpg">
        <img id="s3img5" src="foto/salatre5.jpg">

        <!-- AUDIO sala 3 -->
        <audio id="bgSala3" src="audio/sottofondosala3.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Panorama -->
      <a-sky src="#salatre360" rotation="0 -180 0"></a-sky>

      <!-- Musica di sottofondo -->
      <a-entity id="backgroundSound"
                sound="src: #bgSala3; autoplay: true; loop: true; volume: 0.8"></a-entity>

      <!-- Link indietro a Sala 2 -->
      <a-link href="saladue.html"
              title="Torna indietro – Sala 2"
              image="#museopreview"
              position="6 0 -2"
              rotation="0 -60 0"></a-link>

      <!-- Link avanti Sala 4 -->
      <a-link href="salaquattro.html"
              title="Visita – Sala 4"
              image="#museopreview"
              position="-7 0 0"
              rotation="0 50 0"></a-link>

      <!-- Copertura treppiede -->
      <a-entity position="10 -130 12" rotation="0 0 0">
        <a-cylinder radius="50" height="0.5"
                    material="color: #ffffff; shader: flat; emissive: #ffffff"></a-cylinder>
        <a-image src="#logo" position="0 1 0" width="70" height="70"
                 rotation="90 205 0" scale="-1 1 1"></a-image>
      </a-entity>

      <!-- 5 icone SEARCH  -->
      <a-image id="openP1" class="clickable" src="#searchIcon"
               position="-5 0 2" rotation="0 40 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <a-image id="openP2" class="clickable" src="#searchIcon"
               position="-3 -1 -4" rotation="0 0 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <a-image id="openP3" class="clickable" src="#searchIcon"
               position="3 1 6" rotation="0 -20 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <a-image id="openP4" class="clickable" src="#searchIcon"
               position="2 0.5 -3" rotation="0 -10 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <a-image id="openP5" class="clickable" src="#searchIcon"
               position="5 0 3" rotation="0 -90 0" scale="0.6 0.6 0.6"
               material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>

      <!-- CAMERA + OVERLAY -->
      <a-entity id="rig">
        <a-entity id="cam" camera look-controls position="0 1.6 0">

          <!-- Overlay foto 1 -->
          <a-entity id="ovP1" visible="false" position="0 0 -2">
            <a-plane id="bgP1" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="imgP1" src="#s3img1" position="0 0.05 0.01"></a-image>

            <a-text id="capP1" value="Didascalia opera 1"
                    align="center" color="#fff" width="1.6"
                    position="0 -0.60 0.02"></a-text>

            <a-image id="closeP1" class="clickable" src="#closeIcon"
                     position="0 -0.82 0.30" scale="0.24 0.24 0.24"
                     geometry="primitive: plane; width: 0.26; height: 0.26"
                     material="shader: flat; transparent: true; alphaTest:0.05; depthTest:false"></a-image>
          </a-entity>

          <!-- Overlay foto 2 -->
          <a-entity id="ovP2" visible="false" position="0 0 -2">
            <a-plane id="bgP2" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="imgP2" src="#s3img2" position="0 0.05 0.01"></a-image>

            <a-text id="capP2" value="Busto di donna con la testa coperta, cm.43x39x22, 1879-1880ca."
                    align="center" color="#fff" width="1.7"
                    position="0 -0.60 0.02"></a-text>

            <a-image id="closeP2" class="clickable" src="#closeIcon"
                     position="0 -0.70 0.50" scale="0.24 0.24 0.24"
                     geometry="primitive: plane; width: 0.26; height: 0.26"
                     material="shader: flat; transparent: true; alphaTest:0.05; depthTest:false"></a-image>
          </a-entity>

          <!-- Overlay foto 3 -->
          <a-entity id="ovP3" visible="false" position="0 0 -2">
            <a-plane id="bgP3" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="imgP3" src="#s3img3" position="0 0.05 0.01"></a-image>

            <a-text id="capP3" value="Didascalia opera 3"
                    align="center" color="#fff" width="1.6"
                    position="0 -0.60 0.02"></a-text>

            <a-image id="closeP3" class="clickable" src="#closeIcon"
                     position="0 -0.82 0.30" scale="0.24 0.24 0.24"
                     geometry="primitive: plane; width: 0.26; height: 0.26"
                     material="shader: flat; transparent: true; alphaTest:0.05; depthTest:false"></a-image>
          </a-entity>

          <!-- Overlay foto 4 -->
          <a-entity id="ovP4" visible="false" position="0 0 -2">
            <a-plane id="bgP4" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="imgP4" src="#s3img4" position="0 0.05 0.01"></a-image>

            <a-text id="capP4" value="Didascalia opera 4"
                    align="center" color="#fff" width="1.6"
                    position="0 -0.60 0.02"></a-text>

            <a-image id="closeP4" class="clickable" src="#closeIcon"
                     position="0 -0.82 0.30" scale="0.24 0.24 0.24"
                     geometry="primitive: plane; width: 0.26; height: 0.26"
                     material="shader: flat; transparent: true; alphaTest:0.05; depthTest:false"></a-image>
          </a-entity>

          <!-- Overlay foto 5 -->
          <a-entity id="ovP5" visible="false" position="0 0 -2">
            <a-plane id="bgP5" width="2.5" height="2"
                     material="color:#000; opacity:0.0; transparent:true"></a-plane>

            <a-image id="imgP5" src="#s3img5" position="0 0.05 0.01"></a-image>

            <a-text id="capP5" value="Didascalia opera 5"
                    align="center" color="#fff" width="1.6"
                    position="0 -0.60 0.02"></a-text>

            <a-image id="closeP5" class="clickable" src="#closeIcon"
                     position="0 -0.82 0.30" scale="0.24 0.24 0.24"
                     geometry="primitive: plane; width: 0.26; height: 0.26"
                     material="shader: flat; transparent: true; alphaTest:0.05; depthTest:false"></a-image>
          </a-entity>

        </a-entity>
      </a-entity>
    </a-scene>

    <!-- Toggle audio -->
    <div id="audioToggle">🔊</div>

    <script>
      const cam = document.getElementById('cam');

      /* ===== Toggle audio BG ===== */
      const audioToggle = document.getElementById('audioToggle');
      const backgroundSound = document.getElementById('backgroundSound');
      const bgSound = () => backgroundSound?.components?.sound;
      let isSoundOn = true;
      audioToggle.addEventListener('click', () => {
        if (!bgSound()) return;
        isSoundOn = !isSoundOn;
        if (isSoundOn) { bgSound().playSound(); audioToggle.textContent = '🔊'; }
        else           { bgSound().pauseSound(); audioToggle.textContent = '🔇'; }
      });

      /* ===== Helper: fit immagine ===== */
      function fitToBox(assetSelector, imgEntityId, maxW=2.0, maxH=1.3){
        const asset=document.querySelector(assetSelector);
        const img=document.getElementById(imgEntityId);
        if(!asset) return;
        const ready=()=>{
          const w=asset.naturalWidth, h=asset.naturalHeight; if(!w||!h) return;
          const ar=w/h, boxAr=maxW/maxH;
          let W,H; if(ar>boxAr){ W=maxW; H=maxW/ar; } else { H=maxH; W=maxH*ar; }
          img.setAttribute('width',W.toFixed(3));
          img.setAttribute('height',H.toFixed(3));
        };
        if(asset.complete) ready(); else asset.addEventListener('load', ready, {once:true});
      }

      /* ===== Setup overlay foto ===== */
      function setupPhotoOverlay(openId, overlayId, bgId, closeId, imgId){
        const openBtn=document.getElementById(openId);
        const ov=document.getElementById(overlayId);
        const bg=document.getElementById(bgId);
        const close=document.getElementById(closeId);
        const imgEnt=document.getElementById(imgId);

        function trap(el, handler){
          el.addEventListener('click', (evt)=>{ evt.stopPropagation(); handler(); });
        }

        openBtn.addEventListener('click', ()=>{
          ov.setAttribute('visible', true);
          cam.components['look-controls']?.pause();
          bg.setAttribute('animation__fadein',
            'property: material.opacity; from:0; to:0.95; dur:250; easing:easeOutQuad');
          const srcSel = imgEnt.getAttribute('src');
          fitToBox(srcSel, imgId);
        });

        trap(close, ()=>{
          bg.setAttribute('animation__fadeout',
            'property: material.opacity; from:0.95; to:0; dur:220; easing:easeInQuad');
          setTimeout(()=>{ ov.setAttribute('visible', false); cam.components['look-controls']?.play(); },220);
        });
      }

      setupPhotoOverlay('openP1','ovP1','bgP1','closeP1','imgP1');
      setupPhotoOverlay('openP2','ovP2','bgP2','closeP2','imgP2');
      setupPhotoOverlay('openP3','ovP3','bgP3','closeP3','imgP3');
      setupPhotoOverlay('openP4','ovP4','bgP4','closeP4','imgP4');
      setupPhotoOverlay('openP5','ovP5','bgP5','closeP5','imgP5');
    </script>
  </body>
</html>
